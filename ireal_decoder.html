<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>iReal Decode</title>
<style>
  body { font-family: monospace; padding: 20px; background: #1b2730; color: #e6e3da; font-size: 13px; }
  input[type=text] {
    width: 100%; padding: 8px; background: #0d1a22; color: #e6e3da;
    border: 1px solid #445; border-radius: 4px; font-family: monospace; font-size: 12px;
    box-sizing: border-box; margin-bottom: 12px;
  }
  h3 { color: #94d5ff; margin: 20px 0 8px; }
  pre { background: #0d1a22; padding: 10px; border-radius: 4px; white-space: pre-wrap; word-break: break-all; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 16px; }
  td, th { border: 1px solid #334; padding: 4px 8px; text-align: left; }
  th { background: #0d1a22; color: #94d5ff; }

  /* token flow */
  .flow { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-end; margin: 12px 0; line-height: 1.8; }
  .tok { display: inline-flex; flex-direction: column; align-items: center; font-size: 11px; }
  .tok .label { font-size: 9px; color: #888; }
  .tok .val { padding: 2px 6px; border-radius: 3px; white-space: nowrap; }
  .tok .cells { font-size: 9px; color: #aaa; }

  .t-chord  .val { color: #7fffb2; background: rgba(127,255,178,.15); border: 1px solid rgba(127,255,178,.3); }
  .t-space  .val { color: #888;    background: rgba(136,136,136,.1);  border: 1px solid #334; }
  .t-bar    .val { color: #ff9f7f; background: rgba(255,159,127,.15); border: 1px solid rgba(255,159,127,.3); font-weight: bold; }
  .t-mark   .val { color: #c0a0ff; background: rgba(192,160,255,.15); border: 1px solid rgba(192,160,255,.3); }
  .t-other  .val { color: #ff6b6b; background: rgba(255,107,107,.15); border: 1px solid rgba(255,107,107,.3); }

  /* visual grid */
  .grid-wrap { margin: 12px 0; padding-top: 18px; /* space for rehearsal marks */ }
  .grid { display: grid; grid-template-columns: repeat(16, 1fr); }
  .gcell {
    height: 40px; border: 1px solid #2a3a44; display: flex;
    align-items: center; justify-content: center; font-size: 12px;
    position: relative; box-sizing: border-box; background: #0d1a22;
    min-width: 0; overflow: visible;
  }
  .gcell.chord  { color: #7fffb2; font-weight: bold; background: rgba(127,255,178,.07); }
  .gcell.space  { color: #333; }
  .gcell.nc     { color: #ffd700; font-style: italic; font-size: 9px; }
  .gcell.pause  { color: #aaa; font-size: 18px; }
  .gcell.repeat  { color: #94d5ff; font-size: 16px; }
  .gcell.repeat2 { color: #94d5ff; font-size: 11px; letter-spacing: -1px; }

  /* barlines as absolute overlays on cell edges */
  .gcell .bl { position: absolute; left: 0; top: 0; bottom: 0; z-index: 4; pointer-events: none; }
  .gcell .br { position: absolute; right: 0; top: 0; bottom: 0; z-index: 4; pointer-events: none; }
  .bl.single  { border-left: 2px solid #888; }
  .br.single  { border-right: 2px solid #888; }
  .bl.double  { border-left: 4px double #bbb; }
  .br.double  { border-right: 4px double #bbb; }
  .bl.rep-open  { border-left: 3px solid #4af; box-shadow: 3px 0 0 #4af; }
  .bl.rep-close { border-left: 5px solid #4af; box-shadow: 3px 0 0 #4af; }
  .br.rep-close { border-right: 3px solid #4af; box-shadow: -3px 0 0 #4af; }
  .bl.final { border-left: 5px solid #bbb; }
  .br.final { border-right: 5px solid #bbb; }

  /* rehearsal mark — floats above cell */
  .gcell .mark {
    position: absolute; bottom: 100%; left: 0; margin-bottom: 2px;
    font-size: 8px; font-weight: bold; background: #c0392b;
    color: #fff; padding: 1px 4px; border-radius: 2px; white-space: nowrap; z-index: 5;
  }
  /* size switch (l/s) — square badge above cell, right of any mark */
  .gcell .size-badge {
    position: absolute; bottom: 100%; left: 28px; margin-bottom: 2px;
    font-size: 8px; font-weight: bold; background: #6a0dad;
    color: #e8c8ff; padding: 1px 3px; border-radius: 0; white-space: nowrap; z-index: 5;
  }
  /* volta bracket (1. / 2. ending) — floats above cell, right of rehearsal mark */
  .gcell .volta {
    position: absolute; bottom: 100%; left: 14px; margin-bottom: 2px;
    font-size: 8px; font-weight: bold; color: #87ceeb;
    background: #1a2e3a; padding: 1px 3px; border-radius: 2px;
    white-space: nowrap; border-bottom: 2px solid #87ceeb;
  }

  /* time sig — stacked numbers to the left of the cell, outside barline */
  .gcell .ts {
    position: absolute; right: calc(100% + 3px); top: 50%; transform: translateY(-50%);
    font-size: 11px; font-weight: bold; color: #ffd700;
    line-height: 1; text-align: center; white-space: nowrap; z-index: 5;
    display: flex; flex-direction: column; align-items: center; gap: 0;
  }
  .gcell .ts span { display: block; line-height: 1.1; }

  /* measure count between barlines */
  .between { font-size: 10px; color: #555; padding: 0 4px; align-self: center; }

  .section { background: #0d1a22; border: 1px solid #334; padding: 12px; border-radius: 6px; margin-bottom: 16px; }
</style>
</head>
<body>

<h3>iReal Decode Tool</h3>
<div style="display:flex;gap:8px;align-items:center;margin-bottom:8px">
  <label style="background:#1e3a4a;border:1px solid #445;color:#94d5ff;padding:5px 12px;border-radius:4px;cursor:pointer;font-size:12px">
    📂 打开 .ireal / .html
    <input type="file" accept=".html,.ireal" style="display:none" onchange="loadFile(event)" />
  </label>
  <span id="fileName" style="font-size:12px;color:#556"></span>
</div>
<input type="text" id="urlInput" placeholder="或直接粘贴 irealb:// URL…" oninput="run()" />

<div id="out"></div>

<script>
// ── Decryption ────────────────────────────────────────────────
const MUSIC_PREFIX = '1r34LbKcu7'

function obfusc50(s) {
  const a = s.split('')
  for (let i = 0; i < 5; i++)    [a[i], a[49-i]] = [a[49-i], a[i]]
  for (let i = 10; i < 24; i++)  [a[i], a[49-i]] = [a[49-i], a[i]]
  return a.join('')
}
function unscramble(s) {
  let r = '', rest = s
  while (rest.length > 50) {
    const chunk = rest.slice(0, 50); rest = rest.slice(50)
    r += rest.length < 2 ? chunk : obfusc50(chunk)
  }
  return r + rest
}
function decodeMusic(field) {
  const idx = field.indexOf(MUSIC_PREFIX)
  if (idx === -1) return field
  return unscramble(field.slice(idx + MUSIC_PREFIX.length))
}

// ── Field parse ───────────────────────────────────────────────
function parseUrl(rawUrl) {
  const body = decodeURIComponent(rawUrl.replace(/^irealb:\/\//, ''))
  const songs = body.split('===')
  return songs.map(song => {
    const parts = song.split(/=+/).filter(x => x !== '')
    const musicField = parts.find(p => p.includes(MUSIC_PREFIX)) || ''
    const encrypted = musicField.slice(musicField.indexOf(MUSIC_PREFIX) + MUSIC_PREFIX.length)
    return { parts, musicField, encrypted, decoded: decodeMusic(musicField) }
  }).filter(s => s.musicField)
}

// ── Tokenizer ─────────────────────────────────────────────────
// Each token: { raw, type, cells, barline, barlineType, extra }
// type: 'chord' | 'space' | 'barline' | 'lz' | 'mark' | 'timesig' | 'annotation' | 'unknown'
// cells: number of visual cells this token produces (0 for barline-only)
// barline: bool — does this token place a barline?
// barlineType: 'single'|'double'|'rep-open'|'rep-close'|'final'|null

function tokenize(s) {
  const tokens = []
  let i = 0
  while (i < s.length) {
    // 3-char spacer
    if (s.slice(i,i+3) === 'XyQ') { tokens.push({raw:'XyQ', type:'space', cells:3, barline:false}); i+=3; continue }
    // LZ: 1 space cell + single barline
    if (s.slice(i,i+2) === 'LZ') { tokens.push({raw:'LZ', type:'lz', cells:1, barline:true, barlineType:'single'}); i+=2; continue }
    // barline-only tokens
    if (s[i]==='|') { tokens.push({raw:'|', type:'barline', cells:0, barline:true, barlineType:'single'}); i++; continue }
    if (s[i]==='[') { tokens.push({raw:'[', type:'barline', cells:0, barline:true, barlineType:'double'}); i++; continue }
    if (s[i]===']') { tokens.push({raw:']', type:'barline', cells:0, barline:true, barlineType:'double'}); i++; continue }
    if (s[i]==='{') { tokens.push({raw:'{', type:'barline', cells:0, barline:true, barlineType:'rep-open'}); i++; continue }
    if (s[i]==='}') { tokens.push({raw:'}', type:'barline', cells:0, barline:true, barlineType:'rep-close'}); i++; continue }
    if (s[i]==='Z') { tokens.push({raw:'Z', type:'barline', cells:0, barline:true, barlineType:'final'}); i++; continue }
    // 1-cell spacer
    if (s[i]===' ') { tokens.push({raw:'·', type:'space', cells:1, barline:false}); i++; continue }
    // time sig T44 T34 etc
    if (s[i]==='T' && /\d/.test(s[i+1]||'')) {
      let j=i+1; while(j<s.length&&/\d/.test(s[j]))j++
      tokens.push({raw:s.slice(i,j), type:'timesig', cells:0, barline:false}); i=j; continue
    }
    // section mark *A *B *i etc
    if (s[i]==='*' && i+1<s.length) { tokens.push({raw:'*'+s[i+1], type:'mark', cells:0, barline:false}); i+=2; continue }
    // annotation <...>
    if (s[i]==='<') {
      const e=s.indexOf('>',i); if(e>i){ tokens.push({raw:s.slice(i,e+1), type:'annotation', cells:0, barline:false}); i=e+1; continue }
    }
    // Kcl
    if (s.slice(i,i+3)==='Kcl') {
      tokens.push({raw:'|',   type:'barline', cells:0, barline:true,  barlineType:'single'})
      tokens.push({raw:'·',   type:'space',   cells:1, barline:false})
      tokens.push({raw:'Kcl', type:'chord',   cells:1, barline:false, extra:'/'})
      i+=3; continue
    }
    // r: 2-bar repeat (𝄎)
    if (s[i]==='r') { tokens.push({raw:'r', type:'chord', cells:1, barline:false, extra:'//'}); i++; continue }
    // x: 1-bar repeat (%)
    if (s[i]==='x') { tokens.push({raw:'x', type:'chord', cells:1, barline:false, extra:'%'}); i++; continue }
    // Y vertical offset: Y=1 unit, YY=2, YYY=3
    if (s[i]==='Y') { let j=i; while(j<s.length&&s[j]==='Y')j++; const n=j-i; tokens.push({raw:s.slice(i,j), type:'layout', cells:0, barline:false, extra:`↓${n}unit`}); i=j; continue }
    // p pause
    if (s[i]==='p') { tokens.push({raw:'p', type:'chord', cells:1, barline:false, extra:'/'}); i++; continue }
    // n no-chord
    if (s[i]==='n') { tokens.push({raw:'n', type:'chord', cells:1, barline:false, extra:'N.C.'}); i++; continue }
    // N1 N2 endings
    if (s[i]==='N'&&/\d/.test(s[i+1]||'')) { tokens.push({raw:'N'+s[i+1], type:'mark', cells:0, barline:false}); i+=2; continue }
    // Q Coda S Segno U end f Fermata
    if (s[i]==='Q') { tokens.push({raw:'Q', type:'mark', cells:0, barline:false, extra:'Coda'}); i++; continue }
    if (s[i]==='S') { tokens.push({raw:'S', type:'mark', cells:0, barline:false, extra:'Segno'}); i++; continue }
    if (s[i]==='U') { tokens.push({raw:'U', type:'mark', cells:0, barline:false, extra:'End'}); i++; continue }
    if (s[i]==='f') { tokens.push({raw:'f', type:'mark', cells:0, barline:false, extra:'𝄐 Fermata'}); i++; continue }
    // , chord separator
    if (s[i]===',') { tokens.push({raw:',', type:'sep', cells:0, barline:false}); i++; continue }
    // l / s — global size-state switch (l=large/廓形, s=small/瘦型)
    // l is removed from chord quality regex so it always reaches here
    // s: only a size switch when NOT followed by 'u' (which would be part of 'sus')
    if (s[i]==='l') {
      tokens.push({raw:'l', type:'size', cells:0, barline:false, extra:'large'}); i++; continue
    }
    if (s[i]==='s' && s[i+1]!=='u') {
      tokens.push({raw:'s', type:'size', cells:0, barline:false, extra:'small'}); i++; continue
    }
    // chord (l and s removed from quality chars to avoid eating size tokens)
    const cm = s.slice(i).match(/^[A-GW][\+\-\^\dhob#suadt]*(\/[A-G][#b]?)?/)
    if (cm) { tokens.push({raw:cm[0], type:'chord', cells:1, barline:false}); i+=cm[0].length; continue }
    // bare character → unknown (annotation spillover artifact, ignored)
    tokens.push({raw:s[i], type:'unknown', cells:0, barline:false}); i++
  }

  // merge consecutive unknown tokens into one
  const merged = []
  for (const t of tokens) {
    if (t.type === 'unknown' && merged.length && merged[merged.length-1].type === 'unknown') {
      merged[merged.length-1].raw += t.raw
    } else {
      merged.push(t)
    }
  }
  return merged
}

// ── File loader ───────────────────────────────────────────────
function loadFile(e) {
  const file = e.target.files[0]; if (!file) return
  document.getElementById('fileName').textContent = file.name
  const reader = new FileReader()
  reader.onload = ev => {
    const html = ev.target.result
    // extract irealb:// href
    const m = html.match(/href="(irealb:\/\/[^"]+)"/)
    if (!m) { alert('找不到 irealb:// 链接'); return }
    document.getElementById('urlInput').value = m[1]
    run()
  }
  reader.readAsText(file, 'utf-8')
  e.target.value = ''
}

// ── Render ─────────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

function run() {
  const raw = document.getElementById('urlInput').value.trim()
  if (!raw) { document.getElementById('out').innerHTML=''; return }

  let html = ''
  let songs
  try { songs = parseUrl(raw) } catch(e) { document.getElementById('out').innerHTML=`<pre style="color:#f88">Error: ${esc(e.message)}</pre>`; return }

  songs.forEach((song, si) => {
    const { parts, encrypted, decoded } = song
    html += `<div class="section">`
    html += `<h3>Song ${si+1} — fields</h3>`
    html += `<table><tr><th>#</th><th>value</th></tr>`
    parts.forEach((p,i) => html += `<tr><td>[${i}]</td><td>${esc(p.slice(0,120))}${p.length>120?'…':''}</td></tr>`)
    html += `</table>`

    html += `<h3>加密原文（解密前，去掉前缀后，${encrypted.length} chars）</h3>`
    html += `<pre>${esc(encrypted)}</pre>`
    html += `<h3>解密后 DSL（${decoded.length} chars）</h3>`
    html += `<pre>${esc(decoded)}</pre>`

    const tokens = tokenize(decoded)

    // ── Token table ──
    const TYPE_COLOR = {
      chord:'#7fffb2', space:'#666', lz:'#ff9f7f', barline:'#ff9f7f',
      timesig:'#ffd700', mark:'#c0a0ff', annotation:'#87ceeb',
      size:'#ff69b4', sep:'#555', layout:'#7ec8c8', unknown:'#444'
    }
    html += `<h3>Token table (${tokens.length} tokens)</h3>`
    html += `<table><tr><th>#</th><th>cell@</th><th style="min-width:120px">raw</th><th>type</th><th>+cells</th><th>barline</th><th>extra / note</th></tr>`
    let cellPos = 0
    tokens.forEach((t, idx) => {
      const bl = t.barline ? t.barlineType : ''
      const color = TYPE_COLOR[t.type] || '#aaa'
      const rawDisplay = t.raw.length > 30 ? esc(t.raw.slice(0,30))+'…' : esc(t.raw)
      const rawTitle = t.raw.length > 30 ? ` title="${esc(t.raw)}"` : ''
      const posCell = t.cells > 0 ? `<span style="color:#888">${cellPos}</span>` : `<span style="color:#444">${cellPos}</span>`
      html += `<tr>
        <td style="color:#555">${idx+1}</td>
        <td style="text-align:right;padding-right:8px">${posCell}</td>
        <td${rawTitle} style="color:${color};font-weight:bold">${rawDisplay}</td>
        <td style="color:${color};opacity:.8">${t.type}</td>
        <td style="text-align:center;color:#94d5ff">${t.cells||''}</td>
        <td style="color:#ff9f7f">${bl}</td>
        <td style="color:#888">${t.extra||''}</td>
      </tr>`
      cellPos += t.cells
      if (t.barline) cellPos = 0
    })
    html += `</table>`

    // ── Token flow with cell counts between barlines ──
    html += `<h3>Token flow &amp; cell counts between barlines</h3><div class="flow">`
    let sinceBar = 0
    tokens.forEach(t => {
      const cls = t.type==='chord'?'t-chord': t.type==='space'||t.type==='lz'?'t-space': t.type==='barline'?'t-bar': t.type==='mark'||t.type==='timesig'||t.type==='annotation'?'t-mark':'t-other'
      // show cell count badge before barline
      if (t.barline && sinceBar >= 0) {
        html += `<span class="between">[${sinceBar} cells]</span>`
      }
      const cellLabel = t.cells > 0 ? `+${t.cells}` : ''
      const barLabel  = t.barline ? `| ${t.barlineType}` : ''
      const noteLabel = t.extra ? t.extra : ''
      html += `<span class="tok ${cls}"><span class="label">${cellLabel}</span><span class="val">${esc(t.raw)}</span><span class="cells">${barLabel||noteLabel}</span></span>`
      sinceBar += t.cells
      if (t.barline) sinceBar = 0
    })
    html += `</div>`

    // ── Visual grid ──
    html += `<h3>Visual grid</h3><div class="grid-wrap"><div class="grid">`
    let pendingBarlineLeft = null
    let pendingMark = null
    let pendingTimeSig = null
    let pendingVolta = null
    let pendingSize = null

    tokens.forEach(t => {
      if (t.type === 'size') { pendingSize = t.extra; return }  // 'large' or 'small'
      if (t.type === 'mark' || t.type === 'timesig' || t.type === 'annotation') {
        if (t.type === 'timesig') pendingTimeSig = t.raw.slice(1)  // strip T
        else if (t.raw.startsWith('*')) pendingMark = t.raw.slice(1)
        else if (t.raw.startsWith('N')) pendingVolta = t.raw.slice(1)  // '1' or '2'
        return
      }
      if (t.barline && t.cells === 0) {
        pendingBarlineLeft = t.barlineType
        return
      }

      // emit cells
      for (let c = 0; c < t.cells; c++) {
        const isFirst = c === 0
        const isLast  = c === t.cells - 1

        let cellClass = 'gcell'
        let inner = ''

        if (t.type === 'chord') {
          if (t.extra === '%') { cellClass += ' repeat'; inner = '%' }
          else if (t.extra === '//') { cellClass += ' repeat2'; inner = '//' }
          else if (t.extra === '/') { cellClass += ' pause'; inner = '/' }
          else if (t.extra === 'N.C.') { cellClass += ' nc'; inner = 'N.C.' }
          else {
            cellClass += ' chord'
            // W = invisible root placeholder: show only the /bass part
            const display = t.raw.startsWith('W') ? t.raw.slice(1) : t.raw
            inner = esc(display)
          }
        } else {
          cellClass += ' space'; inner = ''
        }

        let blHtml = '', brHtml = ''
        if (isFirst && (pendingBarlineLeft || (t.type==='lz'&&false))) {
          blHtml = `<span class="bl ${pendingBarlineLeft||'single'}"></span>`
          pendingBarlineLeft = null
        }
        if (isLast && t.barline && blHtml === '') {
          brHtml = `<span class="br ${t.barlineType||'single'}"></span>`
        }

        let markHtml = ''
        if (isFirst && pendingMark) {
          markHtml = `<span class="mark">${esc(pendingMark)}</span>`
          pendingMark = null
        }
        let sizeHtml = ''
        if (isFirst && pendingSize) {
          sizeHtml = `<span class="size-badge">${pendingSize === 'large' ? 'L' : 'S'}</span>`
          pendingSize = null
        }
        let voltaHtml = ''
        if (isFirst && pendingVolta) {
          voltaHtml = `<span class="volta">${pendingVolta}.</span>`
          pendingVolta = null
        }
        let tsHtml = ''
        if (isFirst && pendingTimeSig) {
          const top = pendingTimeSig[0] || '?'
          const bot = pendingTimeSig[1] || pendingTimeSig[0] || '?'
          tsHtml = `<span class="ts"><span>${top}</span><span>${bot}</span></span>`
          pendingTimeSig = null
        }

        html += `<div class="${cellClass}">${blHtml}${brHtml}${markHtml}${sizeHtml}${voltaHtml}${tsHtml}${inner}</div>`
      }

      if (t.barline && t.cells > 0) pendingBarlineLeft = t.barlineType
    })
    html += `</div></div>` // grid + grid-wrap
    html += `</div>`  // section
  })

  document.getElementById('out').innerHTML = html
}
