<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>iReal Editor</title>
<style>
/* ── Themes ── */
:root {
  --bg-page:    #1b2730; --bg-bar:     #0d1a22; --bg-toolbar: #13222c;
  --c-text:     #e6e3da; --c-label:    #556;    --c-border:   #334;
  --c-input-bg: #1b2730;
  --c-btn-bg:   #1e3a4a; --c-btn-bd:   #445;    --c-btn-txt:  #94d5ff;
  --c-btn-hov:  #2a4a5e; --c-sep:      #334;    --c-opt-bg:   #1b2730;
  --c-cell-bd:  #1e3040; --c-cell-hov: rgba(255,255,255,.03);
  --c-sel-bg:   #0e2a38; --c-sel-out:  #4af;
  --c-chord:    #7fffb2; --c-space:    #1e3040;
  --c-nc:       #ffd700; --c-pause:    #888;    --c-repeat:   #94d5ff;
  --c-bl-s:     #668;    --c-bl-d:     #bbb;    --c-bl-r:     #e53;
  --c-mark-bg:  #c0392b; --c-mark-txt: #fff;
  --c-volta:    #87ceeb; --c-volta-bg: #1a2e3a;
  --c-ts:       #ffd700; --c-annot:    #87ceeb;
  --c-inp-bg:   #0d1a22; --c-inp-txt:  #7fffb2; --c-inp-bd:   #4af;
  --c-status:   #445;    --c-status-bd:#223;
}
body.light {
  --bg-page:    #f0ede6; --bg-bar:     #e2ddd5; --bg-toolbar: #e8e4dc;
  --c-text:     #1a1a1a; --c-label:    #999;    --c-border:   #ccc;
  --c-input-bg: #f8f5f0;
  --c-btn-bg:   #d8d4cc; --c-btn-bd:   #bbb;    --c-btn-txt:  #1a4a7a;
  --c-btn-hov:  #c8c4bc; --c-sep:      #ccc;    --c-opt-bg:   #f0ede6;
  --c-cell-bd:  rgba(0,0,0,0.07); --c-cell-hov: rgba(0,0,0,.04);
  --c-sel-bg:   #c5dff0; --c-sel-out:  #2a7abd;
  --c-chord:    #111;    --c-space:    #ccc;
  --c-nc:       #8a6600; --c-pause:    #999;    --c-repeat:   #2a5a8a;
  --c-bl-s:     #555;    --c-bl-d:     #222;    --c-bl-r:     #c0392b;
  --c-mark-bg:  #c0392b; --c-mark-txt: #fff;
  --c-volta:    #2a6a9a; --c-volta-bg: #dce8f0;
  --c-ts:       #8a6600; --c-annot:    #2a6a9a;
  --c-inp-bg:   #fff;    --c-inp-txt:  #1a5c30; --c-inp-bd:   #2a7abd;
  --c-status:   #aaa;    --c-status-bd:#ddd;
}

* { box-sizing: border-box; }
body { font-family: monospace; background: var(--bg-page); color: var(--c-text); margin: 0; font-size: 13px; }

/* ── Meta bar ── */
#meta-bar {
  display: flex; gap: 8px; align-items: center; padding: 8px 12px;
  background: var(--bg-bar); border-bottom: 1px solid var(--c-border); flex-wrap: wrap;
}
#meta-bar label { font-size: 11px; color: var(--c-label); }
#meta-bar input, #meta-bar select {
  background: var(--c-input-bg); color: var(--c-text); border: 1px solid var(--c-border);
  border-radius: 3px; padding: 3px 6px; font-family: monospace; font-size: 12px;
}
#meta-title    { width: 160px; }
#meta-composer { width: 120px; }
#meta-key      { width: 56px; }
#meta-style    { width: 130px; }

/* ── Toolbar ── */
#toolbar {
  display: flex; gap: 6px; align-items: center; padding: 6px 12px;
  background: var(--bg-toolbar); border-bottom: 1px solid var(--c-border); flex-wrap: wrap;
}
.btn, #toolbar button, #toolbar select {
  background: var(--c-btn-bg); border: 1px solid var(--c-btn-bd); color: var(--c-btn-txt);
  padding: 4px 10px; border-radius: 3px; cursor: pointer; font-size: 11px;
  font-family: monospace; white-space: nowrap;
}
.btn:hover, #toolbar button:hover { background: var(--c-btn-hov); }
#toolbar .sep { width: 1px; height: 18px; background: var(--c-sep); margin: 0 2px; }
#toolbar select { color: var(--c-text); padding: 3px 6px; }
#toolbar select option { background: var(--c-opt-bg); }

/* ── Grid ── */
#grid-area { padding: 16px 12px; }
.grid-wrap { padding-top: 22px; }
.grid { display: grid; grid-template-columns: repeat(16, 1fr); row-gap: 22px; }
.no-grid .gcell { border-color: transparent !important; }
.gcell {
  height: 52px; border: 1px solid var(--c-cell-bd); display: flex;
  align-items: center; justify-content: center; font-size: 16px;
  position: relative; background: transparent; min-width: 0; overflow: visible;
  cursor: pointer; user-select: none;
}
.gcell:hover { background: var(--c-cell-hov); }
.gcell.selected { background: var(--c-sel-bg); outline: 2px solid var(--c-sel-out); outline-offset: -2px; z-index: 2; }
.gcell.chord  { color: var(--c-chord); font-weight: bold; background: transparent;
                justify-content: flex-start; align-items: flex-start;
                padding-left: 4px; padding-top: 4px; z-index: 2; overflow: visible; }
.gcell.space  { color: var(--c-space); }
.gcell.nc     { color: var(--c-nc); font-style: italic; font-size: 20px; }
.gcell.pause  { color: var(--c-pause); font-size: 18px; }
.gcell.repeat  { color: var(--c-repeat); width: calc(200% + 2px); z-index: 3; }
.gcell.repeat2 { color: var(--c-repeat); width: calc(200% + 2px); z-index: 3; }
.gcell.repeat.size-small  { width: 100%; }
.gcell.repeat2.size-small { width: 100%; }

/* large/small size modes */
.gcell.size-small svg.csym { transform: scaleX(0.62); transform-origin: left center; }

/* chord SVG */
svg.csym { overflow: visible; display: block; pointer-events: none; }
svg.csym text { font-family: monospace; fill: currentColor; }
.csym-r { font-size: 36px; font-weight: bold; }
.csym-a { font-size: 16px; font-weight: bold; }
.csym-q { font-size: 18px; }
.csym-b { font-size: 16px; font-weight: bold; }

/* barlines */
.gcell .bl { position: absolute; left: 0; top: 0; bottom: 0; z-index: 4; pointer-events: none; }
.gcell .br { position: absolute; left: 100%; top: 0; bottom: 0; z-index: 4; pointer-events: none; }
.bl.single  { border-left: 2px solid var(--c-bl-s); left: -2px; }
.br.single  { border-left: 2px solid var(--c-bl-s); }
.bl.double  { border-left: 4px double var(--c-bl-d); left: -2px; }
.br.double  { border-left: 4px double var(--c-bl-d); }
/* rep-open / rep-close / final rendered via inline SVG */

/* badges */
.gcell .mark {
  position: absolute; bottom: 100%; left: 0; margin-bottom: 2px;
  font-size: 8px; font-weight: bold; background: var(--c-mark-bg);
  color: var(--c-mark-txt); padding: 1px 4px; border-radius: 2px; white-space: nowrap; z-index: 5;
  pointer-events: none;
}
.gcell .volta {
  position: absolute; bottom: 100%; left: 0; margin-bottom: 2px;
  font-size: 10px; font-weight: bold; color: var(--c-bl-r);
  padding: 1px 22px 1px 3px; white-space: nowrap;
  border-left: 2px solid var(--c-bl-r);
  border-top:  2px solid var(--c-bl-r);
  pointer-events: none;
}
.gcell .ts {
  position: absolute; right: calc(100% + 4px); top: 50%; transform: translateY(-50%);
  font-size: 16px; font-weight: bold; color: var(--c-ts); line-height: 1;
  display: flex; flex-direction: column; align-items: center; z-index: 5;
  pointer-events: none;
}
.gcell .ts span { display: block; line-height: 1.5; }
.gcell .ts span:first-child { border-bottom: 1.5px solid currentColor; }
.gcell .annot {
  position: absolute; top: 100%; left: 0; margin-top: 3px;
  font-size: 14px; color: var(--c-annot); white-space: nowrap; z-index: 5;
  pointer-events: none; overflow: visible;
}

/* ── Chord input overlay ── */
#chord-input {
  display: none; position: fixed; z-index: 100;
  background: var(--c-inp-bg); color: var(--c-inp-txt); border: 2px solid var(--c-inp-bd);
  border-radius: 3px; padding: 4px 6px; font-family: monospace; font-size: 13px;
  font-weight: bold; outline: none; min-width: 60px;
}

/* ── Status bar ── */
#status { padding: 4px 12px; font-size: 10px; color: var(--c-status); border-top: 1px solid var(--c-status-bd); }
</style>
</head>
<body class="light">

<div id="meta-bar">
  <label>Title <input id="meta-title" placeholder="Untitled" oninput="song.title=this.value"></label>
  <label>Composer <input id="meta-composer" placeholder="" oninput="song.composer=this.value"></label>
  <label>Key
    <select id="meta-key" onchange="song.key=this.value">
      <option>C</option><option>Db</option><option>D</option><option>Eb</option>
      <option>E</option><option>F</option><option>F#</option><option>Gb</option>
      <option>G</option><option>Ab</option><option>A</option><option>Bb</option><option>B</option>
      <option>A-</option><option>Bb-</option><option>B-</option><option>C-</option>
      <option>C#-</option><option>D-</option><option>Eb-</option><option>E-</option>
      <option>F-</option><option>F#-</option><option>G-</option><option>G#-</option>
    </select>
  </label>
  <label>Style <input id="meta-style" placeholder="Medium Swing" oninput="song.style=this.value"></label>
</div>

<div id="toolbar">
  <label class="btn">📂 Open
    <input type="file" accept=".html,.ireal" style="display:none" onchange="loadFile(event)">
  </label>
  <button onclick="newSong()">New</button>
  <button onclick="exportSong()">💾 Save</button>

  <span class="sep"></span>
  <button onclick="deleteSelected()" title="Delete selected token (Del)">✕ Delete</button>
  <button onclick="insertSpace()" title="Insert space cell">+ Space</button>

  <span class="sep"></span>
  <select id="bl-left" onchange="setLeftBarline(this.value)">
    <option value="">Left barline</option>
    <option value="none">— None</option>
    <option value="|">| Single</option>
    <option value="[">[  Double</option>
    <option value="{">{  Repeat open</option>
    <option value="}">}  Repeat close</option>
    <option value="Z">Z  Final</option>
  </select>
  <select id="bl-right" onchange="setRightBarline(this.value)">
    <option value="">Right barline</option>
    <option value="none">— None</option>
    <option value="|">| Single</option>
    <option value="]">]  Double</option>
    <option value="}">}  Repeat close</option>
    <option value="Z">Z  Final</option>
  </select>

  <select onchange="insertMark(this.value);this.selectedIndex=0">
    <option value="">Mark…</option>
    <option value="A">*A Section A</option>
    <option value="B">*B Section B</option>
    <option value="C">*C Section C</option>
    <option value="D">*D Section D</option>
    <option value="i">*i Intro</option>
    <option value="v">*v Verse</option>
  </select>

  <select onchange="insertTimeSig(this.value);this.selectedIndex=0">
    <option value="">Time sig…</option>
    <option value="T44">4/4</option>
    <option value="T34">3/4</option>
    <option value="T68">6/8</option>
    <option value="T54">5/4</option>
    <option value="T74">7/4</option>
  </select>

  <select onchange="insertVolta(this.value);this.selectedIndex=0">
    <option value="">Ending…</option>
    <option value="1">1st ending</option>
    <option value="2">2nd ending</option>
  </select>

  <span class="sep"></span>
  <button onclick="undo()" title="Undo (Ctrl+Z)">↩ Undo</button>
  <button onclick="copySelected()" title="Copy selected (Ctrl+C)">Copy</button>
  <button onclick="pasteClipboard()" title="Paste after focus (Ctrl+V)">Paste</button>

  <span class="sep"></span>
  <button onclick="transpose(-1)">♭ −1</button>
  <button onclick="transpose(1)">♯ +1</button>

  <span class="sep"></span>
  <button id="theme-btn" onclick="toggleTheme()">🌙 Night</button>
  <button id="grid-btn" onclick="toggleGrid()">格线</button>
</div>

<div id="grid-area">
  <div class="grid-wrap"><div id="grid" class="grid"></div></div>
</div>

<div id="status">Click a cell to select · Type to enter chord · Del to delete · ←/→ to navigate</div>

<input id="chord-input" type="text"
  onkeydown="handleChordKey(event)">

<script>
// ── Constants ──────────────────────────────────────────────────
const MUSIC_PREFIX = '1r34LbKcu7'
const ROOTS = ['C','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B']
const ROOT_SEMITONES = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11}

// ── State ──────────────────────────────────────────────────────
let song = { title: 'Untitled', composer: '', style: 'Medium Swing', key: 'C', tokens: [] }
let focusTokenIdx = -1
let anchorTokenIdx = -1
let selectedSet = new Set()
let cellMap = []   // cellMap[cellIdx] = tokenIdx
let editing = false

// ── Undo / Clipboard ───────────────────────────────────────────
const undoStack = []
let clipboard = []

function saveUndo() {
  undoStack.push(JSON.stringify(song.tokens))
  if (undoStack.length > 50) undoStack.shift()
}
function toggleTheme() {
  const isLight = document.body.classList.toggle('light')
  document.getElementById('theme-btn').textContent = isLight ? '🌙 Night' : '☀ Day'
}
function toggleGrid() {
  const hidden = document.getElementById('grid-area').classList.toggle('no-grid')
  document.getElementById('grid-btn').textContent = hidden ? '格线(隐)' : '格线'
}

function undo() {
  if (!undoStack.length) { setStatus('Nothing to undo'); return }
  song.tokens = JSON.parse(undoStack.pop())
  focusTokenIdx = -1; anchorTokenIdx = -1; selectedSet = new Set()
  render(); updateStatus()
}
function copySelected() {
  if (!selectedSet.size) { setStatus('Nothing selected'); return }
  clipboard = [...selectedSet].sort((a,b)=>a-b).map(i => ({...song.tokens[i]}))
  setStatus(`Copied ${clipboard.length} token(s)`)
}
function pasteClipboard() {
  if (!clipboard.length) { setStatus('Clipboard empty'); return }
  saveUndo()
  const at = focusTokenIdx >= 0 ? focusTokenIdx + 1 : song.tokens.length
  clipboard.forEach((t, i) => song.tokens.splice(at + i, 0, {...t}))
  focusTokenIdx = at + clipboard.length - 1
  selectedSet = new Set(); anchorTokenIdx = -1
  render(); updateStatus()
}

// ── Crypto ─────────────────────────────────────────────────────
function obfusc50(s) {
  const a = s.split('')
  for (let i = 0; i < 5; i++)   [a[i], a[49-i]] = [a[49-i], a[i]]
  for (let i = 10; i < 24; i++) [a[i], a[49-i]] = [a[49-i], a[i]]
  return a.join('')
}
function unscramble(s) {
  let r = '', rest = s
  while (rest.length > 50) {
    const chunk = rest.slice(0, 50); rest = rest.slice(50)
    r += rest.length < 2 ? chunk : obfusc50(chunk)
  }
  return r + rest
}
function decodeMusic(field) {
  const idx = field.indexOf(MUSIC_PREFIX)
  if (idx === -1) return field
  return unscramble(field.slice(idx + MUSIC_PREFIX.length))
}

// ── Tokenizer ──────────────────────────────────────────────────
// raw = exact DSL string used for serialization
function tokenize(s) {
  const tokens = []
  let i = 0
  while (i < s.length) {
    if (s.slice(i,i+3) === 'XyQ') {
      tokens.push({raw:' ', type:'space', cells:1, barline:false})
      tokens.push({raw:' ', type:'space', cells:1, barline:false})
      tokens.push({raw:' ', type:'space', cells:1, barline:false})
      i+=3; continue
    }
    if (s.slice(i,i+2) === 'LZ') {
      tokens.push({raw:' ', type:'space',   cells:1, barline:false})
      tokens.push({raw:'|', type:'barline', cells:0, barline:true, barlineType:'single'})
      i+=2; continue
    }
    if (s[i]==='|') { tokens.push({raw:'|', type:'barline', cells:0, barline:true, barlineType:'single'}); i++; continue }
    if (s[i]==='[') { tokens.push({raw:'[', type:'barline', cells:0, barline:true, barlineType:'double'}); i++; continue }
    if (s[i]===']') { tokens.push({raw:']', type:'barline', cells:0, barline:true, barlineType:'double'}); i++; continue }
    if (s[i]==='{') { tokens.push({raw:'{', type:'barline', cells:0, barline:true, barlineType:'rep-open'}); i++; continue }
    if (s[i]==='}') { tokens.push({raw:'}', type:'barline', cells:0, barline:true, barlineType:'rep-close'}); i++; continue }
    if (s[i]==='Z') { tokens.push({raw:'Z', type:'barline', cells:0, barline:true, barlineType:'final'}); i++; continue }
    if (s[i]===' ') { tokens.push({raw:' ', type:'space', cells:1, barline:false}); i++; continue }
    if (s[i]==='T' && /\d/.test(s[i+1]||'')) {
      let j=i+1; while(j<s.length&&/\d/.test(s[j]))j++
      tokens.push({raw:s.slice(i,j), type:'timesig', cells:0, barline:false}); i=j; continue
    }
    if (s[i]==='*' && i+1<s.length) { tokens.push({raw:'*'+s[i+1], type:'mark', cells:0, barline:false}); i+=2; continue }
    if (s[i]==='<') {
      const e=s.indexOf('>',i); if(e>i){ tokens.push({raw:s.slice(i,e+1), type:'annotation', cells:0, barline:false}); i=e+1; continue }
    }
    if (s.slice(i,i+3)==='Kcl') {
      tokens.push({raw:'|', type:'barline', cells:0, barline:true, barlineType:'single'})
      tokens.push({raw:' ', type:'space',   cells:1, barline:false})
      tokens.push({raw:'p', type:'chord',   cells:1, barline:false, extra:'/'})
      i+=3; continue
    }
    if (s[i]==='r') { tokens.push({raw:'r', type:'chord', cells:1, barline:false, extra:'//'}); i++; continue }
    if (s[i]==='x') { tokens.push({raw:'x', type:'chord', cells:1, barline:false, extra:'%'}); i++; continue }
    if (s[i]==='Y') { let j=i; while(j<s.length&&s[j]==='Y')j++; tokens.push({raw:s.slice(i,j), type:'layout', cells:0, barline:false}); i=j; continue }
    if (s[i]==='p') { tokens.push({raw:'p', type:'chord', cells:1, barline:false, extra:'/'}); i++; continue }
    if (s[i]==='n') { tokens.push({raw:'n', type:'chord', cells:1, barline:false, extra:'N.C.'}); i++; continue }
    if (s[i]==='N'&&/\d/.test(s[i+1]||'')) { tokens.push({raw:'N'+s[i+1], type:'mark', cells:0, barline:false}); i+=2; continue }
    if (s[i]==='Q') { tokens.push({raw:'Q', type:'mark', cells:0, barline:false, extra:'Coda'}); i++; continue }
    if (s[i]==='S') { tokens.push({raw:'S', type:'mark', cells:0, barline:false, extra:'Segno'}); i++; continue }
    if (s[i]==='U') { tokens.push({raw:'U', type:'mark', cells:0, barline:false, extra:'End'}); i++; continue }
    if (s[i]==='f') { tokens.push({raw:'f', type:'mark', cells:0, barline:false, extra:'𝄐'}); i++; continue }
    if (s[i]===',') { tokens.push({raw:',', type:'sep', cells:0, barline:false}); i++; continue }
    if (s[i]==='l') { tokens.push({raw:'l', type:'size', cells:0, barline:false, extra:'normal'}); i++; continue }
    if (s[i]==='s' && s[i+1]!=='u') { tokens.push({raw:'s', type:'size', cells:0, barline:false, extra:'small'}); i++; continue }
    const cm = s.slice(i).match(/^[A-GW][\+\-\^\dhob#suadt]*(\/[A-G][#b]?)?/)
    if (cm) { tokens.push({raw:cm[0], type:'chord', cells:1, barline:false}); i+=cm[0].length; continue }
    tokens.push({raw:s[i], type:'unknown', cells:0, barline:false}); i++
  }
  // merge consecutive unknowns
  const merged = []
  for (const t of tokens) {
    if (t.type==='unknown' && merged.length && merged[merged.length-1].type==='unknown')
      merged[merged.length-1].raw += t.raw
    else merged.push(t)
  }
  return merged
}

// ── Serializer ─────────────────────────────────────────────────
function serializeDsl() {
  return song.tokens.map(t => t.raw).join('')
}
function buildIrealUrl() {
  const dsl  = serializeDsl()
  const enc  = MUSIC_PREFIX + unscramble(dsl)
  const t    = encodeURIComponent(song.title || 'Untitled')
  const c    = encodeURIComponent(song.composer || '')
  const st   = encodeURIComponent(song.style || '')
  const k    = encodeURIComponent(song.key || 'C')
  const m    = encodeURIComponent(enc)
  return `irealb://${t}=${c}==${st}=${k}==${m}==0=0`
}

// ── Renderer ───────────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;') }

const REP_W = 7    // rep-open / rep-close SVG width
const FIN_W = 4    // final SVG width

function repBarlineSVG(type) {
  const H = 52, r = 1.25, cy1 = 17, cy2 = 35
  const col = 'var(--c-bl-r)', cold = 'var(--c-bl-d)'
  const style = `position:absolute;left:0;top:0;overflow:visible;pointer-events:none`
  if (type === 'rep-open') {
    return `<svg width="${REP_W}" height="${H}" style="${style}">` +
      `<rect x="0"    y="0" width="1.5"  height="${H}" fill="${col}"/>` +
      `<rect x="2.75" y="0" width="0.75" height="${H}" fill="${col}"/>` +
      `<circle cx="5.5" cy="${cy1}" r="${r}" fill="${col}"/>` +
      `<circle cx="5.5" cy="${cy2}" r="${r}" fill="${col}"/>` +
      `</svg>`
  }
  if (type === 'rep-close') {
    return `<svg width="${REP_W}" height="${H}" style="${style}">` +
      `<circle cx="1"   cy="${cy1}" r="${r}" fill="${col}"/>` +
      `<circle cx="1"   cy="${cy2}" r="${r}" fill="${col}"/>` +
      `<rect x="3"    y="0" width="0.75" height="${H}" fill="${col}"/>` +
      `<rect x="5"    y="0" width="1.5"  height="${H}" fill="${col}"/>` +
      `</svg>`
  }
  if (type === 'final') {
    return `<svg width="${FIN_W}" height="${H}" style="${style}">` +
      `<rect x="0"    y="0" width="0.75" height="${H}" fill="${cold}"/>` +
      `<rect x="2.25" y="0" width="1.75" height="${H}" fill="${cold}"/>` +
      `</svg>`
  }
  return ''
}

function makeRightBarlineHtml(btype) {
  if (btype === 'single') return '<span class="br single"></span>'
  if (btype === 'double') return '<span class="br double"></span>'
  return ''
}

function repeatSVG(type) {
  const H = 40, sw = 2.5, r = 3.5
  const base = `<svg width="40" height="${H}" style="display:block;overflow:visible">`
  if (type === '%') {
    return base +
      `<circle cx="8"  cy="9"      r="${r}" fill="currentColor"/>` +
      `<line x1="7" y1="${H-4}" x2="31" y2="4" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>` +
      `<circle cx="30" cy="${H-9}" r="${r}" fill="currentColor"/>` +
      `</svg>`
  }
  // '//'
  return base +
    `<circle cx="5"  cy="9"      r="${r-0.5}" fill="currentColor"/>` +
    `<line x1="4"  y1="${H-4}" x2="17" y2="4" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>` +
    `<line x1="19" y1="${H-4}" x2="32" y2="4" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round"/>` +
    `<circle cx="34" cy="${H-9}" r="${r-0.5}" fill="currentColor"/>` +
    `</svg>`
}

// Approximate monospace advance width at given font-size
function monoW(fs) { return fs * 0.603 }

function renderChordSVG(raw) {
  // W = invisible root, show only bass
  if (raw.startsWith('W')) {
    const b = esc(raw.slice(1))
    return `<svg class="csym" height="42"><text x="2" y="34" class="csym-b">${b}</text></svg>`
  }
  const p = parseRoot(raw)
  if (!p) return `<svg class="csym" height="42"><text x="2" y="34" class="csym-r">${esc(raw)}</text></svg>`

  const letter  = p.root[0]
  const acc     = p.root.slice(1)
  const accD    = acc === 'b' ? '♭' : acc === '#' ? '♯' : ''
  const qualD   = esc(p.quality.replace(/\^/g,'Δ').replace(/h/g,'ø').replace(/o/g,'°'))
  const bassD   = p.bass ? esc('/' + p.bass) : ''

  const RF = 36, AF = 16, QF = 18, BF = 16
  const rx = 4,  ry = 34          // root baseline
  const mx = rx + monoW(RF) + 1  // mods x (accidental / quality / bass all share this x)
  const ay = ry - RF * 0.58       // accidental baseline (upper superscript)
  const by = ry + QF              // bass baseline: one quality line below root
  const hasBass = !!bassD
  const svgH = hasBass ? by + 4 : ry + 10

  let s = `<text x="${rx}" y="${ry}" class="csym-r">${letter}</text>`
  if (accD)  s += `<text x="${mx.toFixed(1)}" y="${ay.toFixed(1)}" class="csym-a">${accD}</text>`
  if (qualD) s += `<text x="${mx.toFixed(1)}" y="${ry}"            class="csym-q">${qualD}</text>`
  if (bassD) s += `<text x="${mx.toFixed(1)}" y="${by}"            class="csym-b">${bassD}</text>`

  return `<svg class="csym" height="${svgH}" overflow="visible">${s}</svg>`
}

function render() {
  const grid = document.getElementById('grid')
  cellMap = []

  let pendingBarlineLeft = null
  let pendingMark = null
  let pendingTimeSig = null
  let pendingVolta = null
  let pendingAnnot = null
  let currentSize = 'normal'
  const parts = []

  function findLastCell() {
    for (let i = parts.length - 1; i >= 0; i--)
      if (parts[i].type === 'cell') return parts[i]
    return null
  }

  song.tokens.forEach((t, tidx) => {
    if (t.type === 'sep' || t.type === 'unknown') return
    if (t.type === 'size') { currentSize = t.extra; return }
    if (t.type === 'layout') {
      const h = t.raw.length * 22
      parts.push({type:'layout', html:`<div style="grid-column:1/-1;height:${h}px;"></div>`})
      return
    }
    if (t.type === 'timesig')    { pendingTimeSig = t.raw.slice(1); return }
    if (t.type === 'annotation') { pendingAnnot = t.raw.slice(1,-1); return }
    if (t.type === 'mark') {
      if (t.raw.startsWith('*')) pendingMark = t.raw.slice(1)
      else if (t.raw.startsWith('N')) pendingVolta = t.raw.slice(1)
      return
    }
    if (t.barline && t.cells === 0) {
      const prev = findLastCell()
      if (prev) prev.brHtml = makeRightBarlineHtml(t.barlineType)
      pendingBarlineLeft = t.barlineType
      return
    }

    const isSelected = selectedSet.has(tidx)

    for (let c = 0; c < t.cells; c++) {
      const isFirst = c === 0
      const cellIdx = cellMap.length
      cellMap.push(tidx)

      let cls = 'gcell'
      if (isSelected) cls += ' selected'
      let inner = ''

      if (t.type === 'chord') {
        if      (t.extra === '%')   { cls += ' repeat';  inner = repeatSVG('%') }
        else if (t.extra === '//')  { cls += ' repeat2'; inner = repeatSVG('//') }
        else if (t.extra === '/')   { cls += ' pause';   inner = '/' }
        else if (t.extra === 'N.C.'){ cls += ' nc';      inner = 'N.C.' }
        else {
          cls += ' chord'
          inner = renderChordSVG(t.raw)
        }
      } else {
        cls += ' space'
      }

      if (currentSize === 'small' && t.type === 'chord') cls += ' size-small'

      let blHtml = ''
      if (isFirst && pendingBarlineLeft) {
        const btype = pendingBarlineLeft
        const rightAligned = btype === 'rep-close' || btype === 'final'
        const w = btype === 'final' ? FIN_W : REP_W
        const bstyle = rightAligned ? ` style="left:${-w}px"` : ''
        blHtml = `<span class="bl ${btype}"${bstyle}>${repBarlineSVG(btype)}</span>`
        pendingBarlineLeft = null
      }

      let markHtml = ''
      if (isFirst && pendingMark) {
        markHtml = `<span class="mark">${esc(pendingMark)}</span>`
        pendingMark = null
      }
      let voltaHtml = ''
      if (isFirst && pendingVolta) {
        voltaHtml = `<span class="volta">${esc(pendingVolta)}.</span>`
        pendingVolta = null
      }
      let tsHtml = ''
      if (isFirst && pendingTimeSig) {
        const TS_MAP = {
          '22':['2','2'],'24':['2','4'],'34':['3','4'],'44':['4','4'],
          '54':['5','4'],'64':['6','4'],'74':['7','4'],'54':['5','4'],
          '38':['3','8'],'68':['6','8'],'98':['9','8'],
          '12':['12','8'],'128':['12','8']
        }
        const mapped = TS_MAP[pendingTimeSig]
        const top = mapped ? mapped[0] : (pendingTimeSig.slice(0,-1)||'?')
        const bot = mapped ? mapped[1] : (pendingTimeSig.slice(-1)||'?')
        tsHtml = `<span class="ts"><span>${top}</span><span>${bot}</span></span>`
        pendingTimeSig = null
      }
      let annotHtml = ''
      if (isFirst && pendingAnnot) {
        const am = pendingAnnot.match(/^\*(\d{2})(.*)/)
        const shift = am ? Math.min(parseInt(am[1]), 60) : 0
        const atext = am ? am[2] : pendingAnnot
        const astyle = shift ? ` style="transform:translateY(-${Math.round(shift * 1.2)}px)"` : ''
        annotHtml = `<span class="annot"${astyle}>${esc(atext).replace(/\/\//g, '<br>')}</span>`
        pendingAnnot = null
      }

      parts.push({type:'cell', tidx, cellIdx, cls, inner, blHtml, brHtml:'', markHtml, voltaHtml, tsHtml, annotHtml})
    }
  })

  let html = ''
  for (const p of parts) {
    if (p.type === 'layout') {
      html += p.html
    } else {
      html += `<div class="${p.cls}" data-tidx="${p.tidx}" data-cidx="${p.cellIdx}">${p.blHtml}${p.brHtml}${p.markHtml}${p.voltaHtml}${p.tsHtml}${p.annotHtml}${p.inner}</div>`
    }
  }

  grid.innerHTML = html
}

// ── Selection ──────────────────────────────────────────────────
function selectToken(tidx, shift) {
  cancelEdit()
  if (shift && anchorTokenIdx >= 0) {
    const lo = Math.min(anchorTokenIdx, tidx)
    const hi = Math.max(anchorTokenIdx, tidx)
    selectedSet = new Set()
    for (let i = lo; i <= hi; i++) selectedSet.add(i)
  } else {
    selectedSet = new Set([tidx])
    anchorTokenIdx = tidx
  }
  focusTokenIdx = tidx
  render()
  updateStatus()
}

function editToken(tidx) {
  selectToken(tidx)
  const t = song.tokens[tidx]
  if (t && (t.type === 'chord' || t.type === 'space')) {
    showChordInput(tidx)
  }
}

function clearSelection() {
  cancelEdit()
  focusTokenIdx = -1
  anchorTokenIdx = -1
  selectedSet = new Set()
  render()
}

// ── Chord input ────────────────────────────────────────────────
function showChordInput(tidx) {
  const cell = document.querySelector(`[data-tidx="${tidx}"]`)
  if (!cell) return
  const t = song.tokens[tidx]
  const input = document.getElementById('chord-input')
  const rect = cell.getBoundingClientRect()
  input.style.left   = rect.left + 'px'
  input.style.top    = rect.top + 'px'
  input.style.width  = Math.max(rect.width, 72) + 'px'
  input.style.height = rect.height + 'px'
  input.style.display = 'block'
  // pre-fill with current chord text (empty for space/lz/kcl)
  input.value = (t.type === 'chord' && !t.extra) ? t.raw : ''
  editing = true
  input.focus()
  input.select()
}

function handleChordKey(e) {
  if (e.key === 'Enter' || e.key === 'Tab') {
    e.preventDefault()
    commitEdit(document.getElementById('chord-input').value.trim())
    if (e.key === 'Tab') navigateTokens(e.shiftKey ? -1 : 1)
  } else if (e.key === 'Escape') {
    cancelEdit()
  } else if (e.key === 'Delete' || e.key === 'Backspace') {
    if (document.getElementById('chord-input').value === '') {
      e.preventDefault()
      cancelEdit()
      deleteSelected()
    }
  }
}

function commitEdit(text) {
  if (focusTokenIdx < 0) return
  saveUndo()
  if (!text) {
    song.tokens[focusTokenIdx] = {raw:' ', type:'space', cells:1, barline:false}
  } else {
    const m = text.match(/^[A-GW][\+\-\^\dhob#suadt]*(\/[A-G][#b]?)?$/)
    if (!m) { setStatus(`"${text}" is not a valid chord`); return }
    song.tokens[focusTokenIdx] = {raw:text, type:'chord', cells:1, barline:false}
  }
  cancelEdit()
  render()
}

function cancelEdit() {
  const input = document.getElementById('chord-input')
  input.style.display = 'none'
  editing = false
}

// ── Navigation ─────────────────────────────────────────────────
function cellTokensIndices() {
  // ordered list of token indices that have cells (skipping 0-cell tokens)
  const seen = new Set(), result = []
  cellMap.forEach(tidx => { if (!seen.has(tidx)) { seen.add(tidx); result.push(tidx) } })
  return result
}

function navigateTokens(dir) {
  const indices = cellTokensIndices()
  if (!indices.length) return
  const cur = indices.indexOf(focusTokenIdx)
  const next = cur === -1 ? 0 : Math.max(0, Math.min(indices.length-1, cur + dir))
  selectToken(indices[next], false)
}

// ── Barline editing ────────────────────────────────────────────
const BARLINE_MAP = {'|':'single','[':'double',']':'double','{':'rep-open','}':'rep-close','Z':'final'}

function findAdjacentBarline(tidx, dir) {
  // dir: -1 = look left, +1 = look right
  for (let i = tidx + dir; i >= 0 && i < song.tokens.length; i += dir) {
    const t = song.tokens[i]
    if (t.type === 'barline') return i
    if (t.cells > 0) return -1
  }
  return -1
}

function applyBarline(side, value) {
  if (focusTokenIdx < 0) return
  saveUndo()
  const dir = side === 'left' ? -1 : 1
  const bidx = findAdjacentBarline(focusTokenIdx, dir)
  if (value === 'none') {
    if (bidx >= 0) song.tokens.splice(bidx, 1)
  } else {
    const tok = {raw: value, type:'barline', cells:0, barline:true, barlineType: BARLINE_MAP[value]}
    if (bidx >= 0) song.tokens[bidx] = tok
    else {
      const at = side === 'left' ? focusTokenIdx : focusTokenIdx + 1
      song.tokens.splice(at, 0, tok)
    }
  }
  render(); updateBarlineSelects()
}

function setLeftBarline(v)  { if (v === '') return; applyBarline('left',  v) }
function setRightBarline(v) { if (v === '') return; applyBarline('right', v) }

function updateBarlineSelects() {
  if (focusTokenIdx < 0) {
    document.getElementById('bl-left').value  = ''
    document.getElementById('bl-right').value = ''
    return
  }
  const RAW_FOR_TYPE = {single:'|', double:'[', 'rep-open':'{', 'rep-close':'}', final:'Z'}
  const li = findAdjacentBarline(focusTokenIdx, -1)
  const ri = findAdjacentBarline(focusTokenIdx, +1)
  document.getElementById('bl-left').value  = li >= 0 ? (RAW_FOR_TYPE[song.tokens[li].barlineType] || '') : 'none'
  document.getElementById('bl-right').value = ri >= 0 ? (RAW_FOR_TYPE[song.tokens[ri].barlineType] || '') : 'none'
}

// ── Insert / Delete ────────────────────────────────────────────
function insertBefore(tidx, token) {
  song.tokens.splice(tidx, 0, token)
  if (focusTokenIdx >= tidx) focusTokenIdx++
}

function insertSpace() {
  saveUndo()
  const at = focusTokenIdx >= 0 ? focusTokenIdx : song.tokens.length
  insertBefore(at, {raw:' ', type:'space', cells:1, barline:false})
  render()
}

function insertBarline(raw) {
  if (!raw) return
  saveUndo()
  const map = {'|':'single','[':'double',']':'double','{':'rep-open','}':'rep-close','Z':'final'}
  const at = focusTokenIdx >= 0 ? focusTokenIdx : song.tokens.length
  insertBefore(at, {raw, type:'barline', cells:0, barline:true, barlineType:map[raw]})
  render()
}

function insertMark(letter) {
  if (!letter) return
  saveUndo()
  const at = focusTokenIdx >= 0 ? focusTokenIdx : song.tokens.length
  insertBefore(at, {raw:'*'+letter, type:'mark', cells:0, barline:false})
  render()
}

function insertTimeSig(raw) {
  if (!raw) return
  saveUndo()
  const at = focusTokenIdx >= 0 ? focusTokenIdx : song.tokens.length
  insertBefore(at, {raw, type:'timesig', cells:0, barline:false})
  render()
}

function insertVolta(n) {
  if (!n) return
  saveUndo()
  const at = focusTokenIdx >= 0 ? focusTokenIdx : song.tokens.length
  insertBefore(at, {raw:'N'+n, type:'mark', cells:0, barline:false})
  render()
}

function deleteSelected() {
  if (selectedSet.size === 0) return
  saveUndo()
  const indices = [...selectedSet].sort((a, b) => b - a)
  indices.forEach(i => song.tokens.splice(i, 1))
  focusTokenIdx = -1
  anchorTokenIdx = -1
  selectedSet = new Set()
  render()
  updateStatus()
}

// ── Transposition ──────────────────────────────────────────────
function parseRoot(raw) {
  // returns { root:'C#', quality:'-7', bass:null } or null
  const m = raw.match(/^([A-G][#b]?)(.*?)(?:\/(([A-G][#b]?)))?$/)
  if (!m) return null
  return { root: m[1], quality: m[2], bass: m[4] || null }
}

function transposeRoot(root, semitones) {
  const base = ROOT_SEMITONES[root]
  if (base === undefined) return root
  const n = ((base + semitones) % 12 + 12) % 12
  // prefer flats when going down, sharps when going up
  const flat  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']
  const sharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
  return semitones < 0 ? flat[n] : sharp[n]
}

function transpose(semitones) {
  saveUndo()
  song.tokens.forEach(t => {
    if (t.type !== 'chord' || t.extra) return  // skip special chord types
    const p = parseRoot(t.raw)
    if (!p) return
    const newRoot = transposeRoot(p.root, semitones)
    const newBass = p.bass ? '/' + transposeRoot(p.bass, semitones) : ''
    t.raw = newRoot + p.quality + newBass
  })
  // also transpose key
  const ki = ROOT_SEMITONES[song.key.replace('-','')]
  if (ki !== undefined) {
    const isMinor = song.key.endsWith('-')
    const flat  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']
    const sharp = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
    const n = ((ki + semitones) % 12 + 12) % 12
    song.key = (semitones < 0 ? flat[n] : sharp[n]) + (isMinor ? '-' : '')
    document.getElementById('meta-key').value = song.key
  }
  render()
}

// ── File I/O ───────────────────────────────────────────────────
function loadFile(e) {
  const file = e.target.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = ev => {
    const html = ev.target.result
    const m = html.match(/href="(irealb:\/\/[^"]+)"/)
    if (!m) { alert('No irealb:// link found'); return }
    loadFromUrl(decodeURIComponent(m[1]))
  }
  reader.readAsText(file, 'utf-8')
  e.target.value = ''
}

function loadFromUrl(rawUrl) {
  const body  = rawUrl.replace(/^irealb:\/\//, '')
  const songs = body.split('===')
  const parts = songs[0].split(/=+/).filter(x => x !== '')
  const mIdx  = parts.findIndex(p => p.includes(MUSIC_PREFIX))
  if (mIdx < 0) { alert('Music field not found'); return }

  song.title    = parts[0] || 'Untitled'
  song.composer = parts[1] || ''
  song.style    = mIdx >= 3 ? parts[mIdx-2] || '' : ''
  song.key      = mIdx >= 2 ? parts[mIdx-1] || 'C' : 'C'
  song.tokens   = tokenize(decodeMusic(parts[mIdx]))

  focusTokenIdx = -1
  updateMetaBar()
  render()
}

function newSong() {
  song = { title: 'Untitled', composer: '', style: 'Medium Swing', key: 'C', tokens: blankTokens() }
  focusTokenIdx = -1
  updateMetaBar()
  render()
}

function blankTokens() {
  const toks = []
  toks.push({raw:'[', type:'barline', cells:0, barline:true, barlineType:'double'})
  for (let m = 0; m < 16; m++) {
    toks.push({raw:' ', type:'space', cells:1, barline:false})
    toks.push({raw:' ', type:'space', cells:1, barline:false})
    toks.push({raw:' ', type:'space', cells:1, barline:false})
    toks.push({raw:' ', type:'space', cells:1, barline:false})
    if (m < 15) toks.push({raw:'|', type:'barline', cells:0, barline:true, barlineType:'single'})
  }
  toks.push({raw:']', type:'barline', cells:0, barline:true, barlineType:'double'})
  toks.push({raw:'Z', type:'barline', cells:0, barline:true, barlineType:'final'})
  return toks
}

function exportSong() {
  const url  = buildIrealUrl()
  const title = song.title || 'Untitled'
  const html = `<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head><meta charset="UTF-8"><title>iReal Pro</title></head>
<body>
<h3><a href="${url.replace(/"/g,'&quot;')}">${esc(title)}</a> - ${esc(song.composer)}</h3>
<br/>Made with iReal Editor
</body>
</html>`
  const blob = new Blob([html], {type:'text/html'})
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = title.replace(/[^\w\s-]/g,'').trim() + '.html'
  a.click()
}

// ── UI helpers ─────────────────────────────────────────────────
function updateMetaBar() {
  document.getElementById('meta-title').value    = song.title
  document.getElementById('meta-composer').value = song.composer
  document.getElementById('meta-key').value      = song.key
  document.getElementById('meta-style').value    = song.style
}

function updateStatus() {
  updateBarlineSelects()
  if (focusTokenIdx < 0) { setStatus('Click a cell to select · Type to enter chord · Del to delete · ←/→ to navigate'); return }
  const t = song.tokens[focusTokenIdx]
  setStatus(`Token [${focusTokenIdx}] type:${t.type} raw:"${t.raw}"`)
}

function setStatus(msg) {
  document.getElementById('status').textContent = msg
}

// ── Keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', e => {
  const tag = document.activeElement?.tagName
  // Ctrl shortcuts work even while editing
  if ((e.ctrlKey || e.metaKey) && e.key === 'z') { e.preventDefault(); undo(); return }
  if ((e.ctrlKey || e.metaKey) && e.key === 'c') { e.preventDefault(); copySelected(); return }
  if ((e.ctrlKey || e.metaKey) && e.key === 'v') { e.preventDefault(); pasteClipboard(); return }
  if (editing) return
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') return
  if (e.key === 'ArrowLeft')  { e.preventDefault(); navigateTokens(-1) }
  if (e.key === 'ArrowRight') { e.preventDefault(); navigateTokens(1) }
  if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteSelected() }
  if (e.key === 'Escape') clearSelection()
  if (e.key === 'Enter' && focusTokenIdx >= 0) { editToken(focusTokenIdx); return }
})

// Close chord input when clicking outside it
document.addEventListener('mousedown', e => {
  if (!editing) return
  if (!e.target.closest('#chord-input')) {
    commitEdit(document.getElementById('chord-input').value.trim())
  }
})

// ── Grid click delegation ──────────────────────────────────────
let _lastClickTidx = -1
let _lastClickTime = 0

document.getElementById('grid').addEventListener('click', e => {
  const cell = e.target.closest('[data-tidx]')
  if (!cell) return
  const tidx = parseInt(cell.dataset.tidx)
  const now = Date.now()
  const isDbl = (tidx === _lastClickTidx && now - _lastClickTime < 400)

  selectToken(tidx, e.shiftKey)

  if (isDbl && !e.shiftKey) {
    editToken(tidx)
    _lastClickTidx = -1
  } else {
    _lastClickTidx = tidx
    _lastClickTime = now
  }
})
