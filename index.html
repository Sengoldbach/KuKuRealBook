<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chord Chart Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Georgia', serif;
    background: #f5f0e8;
    color: #1a1a1a;
    min-height: 100vh;
  }

  /* ── Header ── */
  .song-header {
    background: #fff;
    border-bottom: 2px solid #c8b89a;
    padding: 16px 24px;
    display: flex;
    align-items: baseline;
    gap: 24px;
  }
  .song-title {
    font-size: 22px;
    font-weight: bold;
    border: none;
    outline: none;
    background: transparent;
    font-family: inherit;
    min-width: 200px;
  }
  .song-meta {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
  }
  .meta-field {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #666;
  }
  .meta-field label { font-weight: bold; }
  .meta-field input, .meta-field select {
    border: none;
    border-bottom: 1px solid #ccc;
    background: transparent;
    font-family: inherit;
    font-size: 13px;
    outline: none;
    color: #333;
  }
  .meta-field input { width: 100px; }

  /* ── Toolbar ── */
  .toolbar {
    background: #fff;
    border-bottom: 1px solid #ddd;
    padding: 8px 24px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar-group {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .toolbar-sep {
    width: 1px;
    height: 24px;
    background: #ddd;
    margin: 0 4px;
  }
  .btn {
    padding: 4px 10px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #fafafa;
    cursor: pointer;
    font-size: 12px;
    font-family: inherit;
    color: #333;
    transition: background 0.1s;
  }
  .btn:hover { background: #eee; }
  .btn-icon { padding: 3px 5px; display: inline-flex; align-items: center; justify-content: center; }
  .btn.active { background: #4a7fb5; color: #fff; border-color: #4a7fb5; }

  /* ── Chart ── */
  .chart-area {
    padding: 24px;
    max-width: 960px;
    margin: 0 auto;
  }
  .chart-header {
    margin-bottom: 20px;
    border-bottom: 2px solid #c8b89a;
    padding-bottom: 12px;
  }
  .chart-header-title {
    font-size: 26px;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .chart-header-sub {
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
    font-size: 13px;
    color: #666;
  }

  .chart-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    margin-bottom: 0;
    position: relative;
  }

  /* SVG barline overlays — centered on cell edge */
  .barline-svg {
    position: absolute;
    top: 0;
    height: 40px;
    pointer-events: none;
    z-index: 10;
  }

  /* rehearsal mark */
  .rehearsal-mark {
    position: absolute;
    top: -14px;
    left: 6px;
    font-size: 11px;
    font-weight: bold;
    color: #fff;
    padding: 1px 5px;
    border-radius: 3px;
    z-index: 10;
  }
  .mark-A { background: #c0392b; }
  .mark-B { background: #2980b9; }
  .mark-C { background: #27ae60; }
  .mark-D { background: #e67e22; }
  .mark-intro { background: #8e44ad; font-size: 9px; }
  .mark-verse  { background: #16a085; font-size: 9px; }

  .cell {
    position: relative;
    cursor: pointer;
    border-right: 1px dashed #e0d8cc;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    padding: 6px 4px 4px 14px;
    user-select: none;
    transition: background 0.08s;
    min-width: 0;
    overflow: visible;
    height: 40px;
    background: #fff;
  }
  /* only first cell in measure needs the left-barline clearance */
  .cell:not(:first-child) { padding-left: 4px; }
  .cell:last-child { border-right: none; }
  .cell:hover { background: #f0ece4; }
  .cell.focused  { background: #ddeeff; outline: 2px solid #4a7fb5; outline-offset: -2px; z-index: 5; }
  .cell.editing  { background: #fff9e6; outline: 2px solid #e6a817; outline-offset: -2px; z-index: 5; }
  .cell.selected { background: #cce4ff; }

  /* chord display */
  .chord-wrapper {
    display: inline-flex;
    align-items: flex-end;
    line-height: 1;
    gap: 1px;
    white-space: nowrap;
  }
  .chord-root {
    font-size: 20px;
    font-weight: bold;
    line-height: 1;
    color: #1a1a1a;
  }
  .chord-quality {
    font-size: 11px;
    font-weight: normal;
    color: #444;
    padding-bottom: 2px;
  }
  .chord-bass {
    font-size: 20px;
    font-weight: bold;
    color: #1a1a1a;
  }
  /* time signature — floats to the LEFT of the cell's left barline */
  .time-sig {
    position: absolute;
    right: 100%;
    top: 50%;
    transform: translateY(-50%);
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-size: 15px;
    font-weight: bold;
    line-height: 1;
    color: #222;
    font-family: 'Georgia', serif;
    gap: 1px;
    pointer-events: none;
    z-index: 11;
  }
  .time-sig span { display: block; line-height: 1; }

  .cell-nc { font-size: 11px; color: #888; font-style: italic; }
  .cell-pause { font-size: 18px; color: #aaa; }
  .cell-repeat { font-size: 22px; color: #555; font-family: monospace; line-height: 1; }

  /* per-cell lyrics row — only rendered when at least one cell has lyrics */
  .lyrics-row {
    display: grid;
    position: relative;
  }
  .cell-lyrics {
    font-size: 12px;
    font-style: italic;
    color: #555;
    white-space: pre;
    overflow: visible;
    background: transparent;
    outline: none;
    padding: 2px 0;
    width: 100%;
    min-width: 0;
    box-sizing: border-box;
    cursor: text;
    position: relative;
    z-index: 1;
    text-align: left;
    direction: ltr;
    line-height: 1.4;
  }
  .cell-lyrics:focus {
    background: rgba(255,249,230,0.95);
    outline: 1px solid #e6a817;
    outline-offset: -1px;
    z-index: 2;
  }
  /* bottom click zone on chord cells to trigger lyrics */
  .cell::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 10px;
    cursor: text;
    z-index: 6;
  }

  /* inline editor */
  .cell-input {
    position: absolute;
    inset: 0;
    border: none;
    outline: none;
    background: #fff9e6;
    font-family: 'Georgia', serif;
    font-size: 16px;
    font-weight: bold;
    padding: 6px 4px;
    z-index: 20;
    width: 100%;
  }

  /* autocomplete dropdown */
  .autocomplete {
    position: absolute;
    top: 100%;
    left: 0;
    background: #fff;
    border: 1px solid #ccc;
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(0,0,0,.15);
    z-index: 100;
    min-width: 140px;
    max-height: 200px;
    overflow-y: auto;
    font-family: 'Georgia', serif;
  }
  .autocomplete-item {
    padding: 6px 10px;
    cursor: pointer;
    font-size: 14px;
    white-space: nowrap;
  }
  .autocomplete-item:hover,
  .autocomplete-item.selected { background: #ddeeff; }

  /* ── Print ── */
  @media print {
    .song-header, .toolbar, .hint { display: none !important; }
    .chart-area { padding: 16px; max-width: 100%; margin: 0; }
    body { background: #fff; }
  }

  /* ── Footer hint ── */
  .hint {
    text-align: center;
    color: #999;
    font-size: 12px;
    padding: 12px;
  }
  .hint kbd {
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 3px;
    padding: 1px 5px;
    font-size: 11px;
    font-family: monospace;
  }
</style>
</head>
<body>

<!-- Header -->
<div class="song-header">
  <input class="song-title" id="songTitle" value="Autumn Leaves" />
  <div class="song-meta">
    <div class="meta-field">
      <label>Composer</label>
      <input id="songComposer" value="Kosma Joseph" />
    </div>
    <div class="meta-field">
      <label>Style</label>
      <input id="songStyle" value="Medium Swing" />
    </div>
    <div class="meta-field">
      <label>Key</label>
      <select id="songKey">
        <option>C</option><option>Db</option><option>D</option>
        <option>Eb</option><option>E</option><option>F</option>
        <option>F#</option><option>Gb</option><option>G</option>
        <option>Ab</option><option>A</option><option>Bb</option><option>B</option>
        <option selected>Gm</option><option>Dm</option><option>Am</option>
        <option>Em</option><option>Bm</option><option>F#m</option>
        <option>C#m</option><option>G#m</option><option>Ebm</option>
        <option>Bbm</option><option>Fm</option><option>Cm</option>
      </select>
    </div>
    <div class="meta-field">
      <label>Time</label>
      <select id="songTime">
        <option selected>4/4</option><option>3/4</option><option>2/4</option>
        <option>6/8</option><option>5/4</option>
      </select>
    </div>
  </div>
</div>

<!-- Toolbar -->
<div class="toolbar">
  <div class="toolbar-group">
    <button class="btn" onclick="addCells(4)">+ 4 Cells</button>
    <button class="btn" onclick="addCells(1)">+ 1 Cell</button>
    <button class="btn" onclick="deleteCells()">– Delete</button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group" style="flex-direction:column;align-items:flex-start;gap:3px">
    <div style="display:flex;align-items:center;gap:4px">
      <span style="font-size:11px;color:#888;width:32px;text-align:right">Left</span>
      <button class="btn btn-icon" onclick="setBarlineLeft('single')" title="Single">
        <svg width="8" height="22"><line x1="4" y1="1" x2="4" y2="21" stroke="#333" stroke-width="1.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineLeft('double')" title="Double">
        <svg width="10" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="1.5"/><line x1="7" y1="1" x2="7" y2="21" stroke="#333" stroke-width="1.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineLeft('repeat-open')" title="Repeat open">
        <svg width="16" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="3"/><line x1="6" y1="1" x2="6" y2="21" stroke="#333" stroke-width="1.5"/><circle cx="11" cy="8" r="1.6" fill="#333"/><circle cx="11" cy="14" r="1.6" fill="#333"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineLeft('repeat-close')" title="Repeat close">
        <svg width="16" height="22"><circle cx="5" cy="8" r="1.6" fill="#333"/><circle cx="5" cy="14" r="1.6" fill="#333"/><line x1="10" y1="1" x2="10" y2="21" stroke="#333" stroke-width="1.5"/><line x1="14" y1="1" x2="14" y2="21" stroke="#333" stroke-width="3"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineLeft('final')" title="Final">
        <svg width="10" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="1.5"/><line x1="8" y1="1" x2="8" y2="21" stroke="#333" stroke-width="3.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineLeft('none')" title="None">
        <svg width="8" height="22"><line x1="1" y1="11" x2="7" y2="11" stroke="#aaa" stroke-width="1.5" stroke-dasharray="2,2"/></svg></button>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <span style="font-size:11px;color:#888;width:32px;text-align:right">Right</span>
      <button class="btn btn-icon" onclick="setBarlineRight('single')" title="Single">
        <svg width="8" height="22"><line x1="4" y1="1" x2="4" y2="21" stroke="#333" stroke-width="1.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineRight('double')" title="Double">
        <svg width="10" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="1.5"/><line x1="7" y1="1" x2="7" y2="21" stroke="#333" stroke-width="1.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineRight('repeat-open')" title="Repeat open">
        <svg width="16" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="3"/><line x1="6" y1="1" x2="6" y2="21" stroke="#333" stroke-width="1.5"/><circle cx="11" cy="8" r="1.6" fill="#333"/><circle cx="11" cy="14" r="1.6" fill="#333"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineRight('repeat-close')" title="Repeat close">
        <svg width="16" height="22"><circle cx="5" cy="8" r="1.6" fill="#333"/><circle cx="5" cy="14" r="1.6" fill="#333"/><line x1="10" y1="1" x2="10" y2="21" stroke="#333" stroke-width="1.5"/><line x1="14" y1="1" x2="14" y2="21" stroke="#333" stroke-width="3"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineRight('final')" title="Final">
        <svg width="10" height="22"><line x1="2" y1="1" x2="2" y2="21" stroke="#333" stroke-width="1.5"/><line x1="8" y1="1" x2="8" y2="21" stroke="#333" stroke-width="3.5"/></svg></button>
      <button class="btn btn-icon" onclick="setBarlineRight('none')" title="None">
        <svg width="8" height="22"><line x1="1" y1="11" x2="7" y2="11" stroke="#aaa" stroke-width="1.5" stroke-dasharray="2,2"/></svg></button>
    </div>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group" style="margin-left:12px">
    <span style="font-size:12px;color:#666;margin-right:4px">Mark:</span>
    <button class="btn" style="background:#c0392b;color:#fff;border-color:#c0392b" onclick="setMark('A')">A</button>
    <button class="btn" style="background:#2980b9;color:#fff;border-color:#2980b9" onclick="setMark('B')">B</button>
    <button class="btn" style="background:#27ae60;color:#fff;border-color:#27ae60" onclick="setMark('C')">C</button>
    <button class="btn" style="background:#e67e22;color:#fff;border-color:#e67e22" onclick="setMark('D')">D</button>
    <button class="btn" style="background:#8e44ad;color:#fff;border-color:#8e44ad" onclick="setMark('intro')">Intro</button>
    <button class="btn" style="background:#16a085;color:#fff;border-color:#16a085" onclick="setMark('verse')">Verse</button>
    <button class="btn" onclick="setMark(null)">Clear</button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <span style="font-size:12px;color:#666;margin-right:4px">Time Sig:</span>
    <select id="timeSigSelect" style="font-family:inherit;font-size:12px;border:1px solid #ccc;border-radius:4px;padding:3px 6px;background:#fafafa;">
      <option value="4/4">4/4</option>
      <option value="3/4">3/4</option>
      <option value="2/4">2/4</option>
      <option value="2/2">2/2</option>
      <option value="6/8">6/8</option>
      <option value="5/4">5/4</option>
      <option value="7/4">7/4</option>
      <option value="5/8">5/8</option>
      <option value="7/8">7/8</option>
      <option value="9/8">9/8</option>
      <option value="12/8">12/8</option>
    </select>
    <button class="btn" onclick="setTimeSig()">Set</button>
    <button class="btn" onclick="clearTimeSig()">Clear</button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <span style="font-size:12px;color:#666;margin-right:4px">Transpose→</span>
    <select id="transposeKey" style="font-family:inherit;font-size:12px;border:1px solid #ccc;border-radius:4px;padding:3px 6px;background:#fafafa;">
      <option value="">key…</option>
      <option>C</option><option>Db</option><option>D</option><option>Eb</option>
      <option>E</option><option>F</option><option>F#</option><option>G</option>
      <option>Ab</option><option>A</option><option>Bb</option><option>B</option>
      <option>Cm</option><option>Dm</option><option>Ebm</option><option>Em</option>
      <option>Fm</option><option>F#m</option><option>Gm</option><option>G#m</option>
      <option>Am</option><option>Bbm</option><option>Bm</option><option>C#m</option>
    </select>
    <button class="btn" onclick="doTranspose()">Go</button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <span style="font-size:12px;color:#666;margin-right:4px">View:</span>
    <button class="btn active" id="view-chord"  onclick="setViewMode('chord')">Chord</button>
    <button class="btn"        id="view-roman"  onclick="setViewMode('roman')">Ⅰ</button>
    <button class="btn"        id="view-arabic" onclick="setViewMode('arabic')">1</button>
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group">
    <button class="btn" onclick="saveToFile()" title="Save as JSON">💾 Save</button>
    <button class="btn" onclick="document.getElementById('fileInput').click()" title="Load JSON">📂 Load</button>
    <button class="btn" onclick="window.print()" title="Print">🖨 Print</button>
    <input type="file" id="fileInput" accept=".json" style="display:none" onchange="loadFromFile(event)" />
  </div>
  <div class="toolbar-sep"></div>
  <div class="toolbar-group" style="flex-direction:column;align-items:flex-start;gap:3px">
    <div style="display:flex;align-items:center;gap:4px">
      <span style="font-size:11px;color:#888;width:12px">H</span>
      <input type="range" id="scaleX" min="30" max="100" value="100" style="width:80px">
      <span id="scaleXLabel" style="font-size:12px;color:#444;width:34px">100%</span>
    </div>
    <div style="display:flex;align-items:center;gap:4px">
      <span style="font-size:11px;color:#888;width:12px">V</span>
      <input type="range" id="scaleY" min="30" max="100" value="100" style="width:80px">
      <span id="scaleYLabel" style="font-size:12px;color:#444;width:34px">100%</span>
    </div>
  </div>
</div>

<!-- Chart -->
<div id="chartWrapper">
  <div class="chart-area" id="chartArea"></div>
</div>

<div class="hint">
  <kbd>Click</kbd> to focus &nbsp;·&nbsp;
  <kbd>Enter</kbd> or type to edit &nbsp;·&nbsp;
  <kbd>Tab</kbd> / <kbd>↑↓←→</kbd> to navigate &nbsp;·&nbsp;
  <kbd>Esc</kbd> to cancel &nbsp;·&nbsp;
  <kbd>Delete</kbd> to clear cell
</div>

<script>
// ─────────────────────────────────────────────
//  Flat-cell model — no measure concept
// ─────────────────────────────────────────────

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
}
let nextId = 100
function newId() { return 'c'+(nextId++) }

function makeCell(props = {}) {
  return { id:newId(), type:'space', chord:null,
    barlineLeft:null, barlineRight:null,
    timeSignature:null, rehearsalMark:null,
    lyrics:null, ...props }
}
function cc(root, quality, extra={}) {
  return makeCell({ type:'chord', chord:{root,quality}, ...extra })
}
function sc(extra={}) { return makeCell(extra) }

let song = {
  title:'Autumn Leaves', composer:'Kosma Joseph',
  style:'Medium Swing', key:'Gm', timeSignature:'4/4',
  cellsPerRow:16,
  cells:[
    cc('C',  '-7',   {barlineLeft:'repeat-open', rehearsalMark:'A'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('F',  '7',    {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('Bb', '^7',   {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('Eb', '^7',   {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('A',  '-7b5', {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('D',  '7b9',  {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'repeat-close'}),
    cc('G',  '-7',   {barlineLeft:'single'}), sc(), sc(), sc({barlineRight:'single'}),
    cc('G',  '-',    {barlineLeft:'none'}),   sc(), sc(), sc({barlineRight:'final'}),
  ]
}

// ─────────────────────────────────────────────
//  State
// ─────────────────────────────────────────────
let focusIdx        = 0
let editingIdx      = -1
let editingLyricsIdx = -1
let anchorIdx       = -1
let clipboard        = []
let clipFromThisApp  = false  // true only when clipboard was set by our own Ctrl+C
let viewMode         = 'chord' // 'chord' | 'roman' | 'arabic'
let undoStack        = []
let redoStack        = []
const MAX_HISTORY    = 60

window.addEventListener('blur', () => { clipFromThisApp = false })

function syncKeySelect(key) {
  const el = document.getElementById('songKey')
  for (const opt of el.options) { if (opt.value===key){opt.selected=true;break} }
}

function snapshotSong() {
  return { cells: JSON.parse(JSON.stringify(song.cells)), key: song.key }
}
function restoreSnapshot(snap, fi) {
  song.cells = snap.cells
  song.key = snap.key
  focusIdx = Math.min(fi, song.cells.length-1); anchorIdx = -1; editingLyricsIdx = -1
  syncKeySelect(song.key)
  render()
}

function saveHistory() {
  undoStack.push({ snap: snapshotSong(), fi: focusIdx })
  if (undoStack.length > MAX_HISTORY) undoStack.shift()
  redoStack = []
}
function undo() {
  if (!undoStack.length) return
  redoStack.push({ snap: snapshotSong(), fi: focusIdx })
  const s = undoStack.pop(); restoreSnapshot(s.snap, s.fi)
}
function redo() {
  if (!redoStack.length) return
  undoStack.push({ snap: snapshotSong(), fi: focusIdx })
  const s = redoStack.pop(); restoreSnapshot(s.snap, s.fi)
}

// ─────────────────────────────────────────────
//  Music theory — transposition & degree display
// ─────────────────────────────────────────────
const NOTE_SEMI  = {C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11}
const SEMI_SHARP = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B']
const SEMI_FLAT  = ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B']
const SHARP_KEYS = new Set(['G','D','A','E','B','F#','C#','Em','Bm','F#m','C#m','G#m','D#m'])
const DEG_ROMAN  = ['I','♭II','II','♭III','III','IV','♭V','V','♭VI','VI','♭VII','VII']
const DEG_ARABIC = ['1','♭2','2','♭3','3','4','♭5','5','♭6','6','♭7','7']

function noteToSemi(n)          { return NOTE_SEMI[n] ?? 0 }
function semiToNote(s, sharp)   { return (sharp ? SEMI_SHARP : SEMI_FLAT)[((s%12)+12)%12] }
function keyUsesSharp(k)        { return SHARP_KEYS.has(k) }
function keyRootNote(k)         { return k.replace(/m$/,'') }
function transposeNote(n, iv, sharp) { return semiToNote(noteToSemi(n)+iv, sharp) }

function degName(note, key, mode) {
  const deg = ((noteToSemi(note) - noteToSemi(keyRootNote(key))) + 12) % 12
  return mode==='roman' ? DEG_ROMAN[deg] : DEG_ARABIC[deg]
}

function transposeSong(targetKey) {
  saveHistory()
  const iv = (noteToSemi(keyRootNote(targetKey)) - noteToSemi(keyRootNote(song.key)) + 12) % 12
  const sharp = keyUsesSharp(targetKey)
  if (iv !== 0) {
    song.cells.forEach(cell => {
      if (cell.type==='chord') {
        cell.chord.root = transposeNote(cell.chord.root, iv, sharp)
        if (cell.chord.bass) cell.chord.bass = transposeNote(cell.chord.bass, iv, sharp)
      }
    })
  }
  song.key = targetKey
  syncKeySelect(targetKey)
  render()
}

function setViewMode(mode) {
  viewMode = mode
  ;['chord','roman','arabic'].forEach(m =>
    document.getElementById('view-'+m).classList.toggle('active', m===mode))
  render()
}

function doTranspose() {
  const k = document.getElementById('transposeKey').value
  if (k) transposeSong(k)
}

// ─────────────────────────────────────────────
//  Chord qualities
// ─────────────────────────────────────────────
const QUALITIES = ['','-','+','o','6','-6','69','^7','^9','^13','^7#11',
  '7','9','11','13','7sus4','9sus','13sus','7b9','7#9','7alt','7#11','7b5','7#5','7b13',
  '-7','-9','-11','-7b5','-^7','-^9','o7','sus4','sus2','add9','5']
const ROOTS = ['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B']
const QUALITY_DISPLAY = {'^7':'Δ7','^9':'Δ9','^13':'Δ13','^7#11':'Δ7#11',
  '-7b5':'ø7','o7':'°7','o':'°','-':'m','-7':'m7','-9':'m9','-11':'m11','-^7':'mΔ7'}
function displayQuality(q) { return QUALITY_DISPLAY[q]??q }

function parseChordInput(text) {
  text = text.trim()
  if (!text||text==='%') return {type:'repeat',bars:1}
  if (/^n\.?c\.?$/i.test(text)) return {type:'nc'}
  if (text.toLowerCase()==='p') return {type:'pause'}
  if (text===' '||text==='.') return {type:'space'}
  const m = text.match(/^([A-G][b#]?)(.*?)(?:\/([A-G][b#]?))?$/)
  if (!m) return null
  const root=m[1], quality=m[2].trim()||undefined, bass=m[3]||undefined
  if (!ROOTS.includes(root)) return null
  return {type:'chord', chord:{root,quality,bass}}
}

function getSuggestions(text) {
  if (!text) return []
  const m = text.trim().match(/^([A-G][b#]?)(.*)$/)
  if (!m) return []
  const root=m[1], partial=m[2].trim().toLowerCase()
  if (!ROOTS.includes(root)) return []
  return QUALITIES.filter(q=>q.toLowerCase().startsWith(partial)).slice(0,12)
    .map(q=>({label:root+q, root, quality:q||undefined}))
}

// ─────────────────────────────────────────────
//  Selection
// ─────────────────────────────────────────────
function selMin() { return anchorIdx<0 ? focusIdx : Math.min(anchorIdx,focusIdx) }
function selMax() { return anchorIdx<0 ? focusIdx : Math.max(anchorIdx,focusIdx) }
function isInSel(idx) { return anchorIdx>=0 && idx>=selMin() && idx<=selMax() }

// ─────────────────────────────────────────────
//  Render
// ─────────────────────────────────────────────
function render() {
  const area = document.getElementById('chartArea')
  const cpr  = song.cellsPerRow||16
  const rows = []

  for (let ri=0; ri*cpr < song.cells.length; ri++) {
    const rowCells = song.cells.slice(ri*cpr, ri*cpr+cpr)
    let html = `<div class="chart-row" style="grid-template-columns:repeat(${cpr},1fr);margin-top:${ri===0?'32':'24'}px">`
    const blOverlays = []

    rowCells.forEach((cell, colIdx) => {
      const idx = ri*cpr+colIdx
      const isFocus   = idx===focusIdx
      const isEditing = idx===editingIdx
      const isSel     = isInSel(idx) && !isFocus

      let cls = 'cell'
      if (isFocus)   cls += ' focused'
      if (isEditing) cls += ' editing'
      if (isSel)     cls += ' selected'

      const markHtml = cell.rehearsalMark
        ? `<div class="rehearsal-mark mark-${cell.rehearsalMark}">${cell.rehearsalMark.toUpperCase()}</div>`
        : ''

      let innerHtml = isEditing
        ? `<input class="cell-input" id="cellInput" autocomplete="off"/><div class="autocomplete" id="autocomplete"></div>`
        : renderCell(cell, cell.timeSignature)

      const padL = cell.barlineLeft ? 'padding-left:10px' : ''
      html += `<div class="${cls}" data-idx="${idx}"${padL?` style="${padL}"`:''} >${markHtml}${innerHtml}</div>`

      if (cell.barlineLeft)  blOverlays.push([colIdx,       'left',  cell.barlineLeft ])
      if (cell.barlineRight) blOverlays.push([colIdx+1,     'right', cell.barlineRight])
    })

    // Barline overlays rendered AFTER all cells — always on top
    blOverlays.forEach(([col, side, type]) => {
      const pct = (col / cpr * 100).toFixed(4)
      html += barlineSVG(type, side).replace('<svg ', `<svg class="barline-svg" style="left:${pct}%;transform:translateX(-50%);" `)
    })

    html += '</div>'

    // Lyrics row: only render if at least one cell in row has lyrics or is being edited
    const rowHasLyrics = rowCells.some((c, ci) => c.lyrics || (ri*cpr+ci) === editingLyricsIdx)
    if (rowHasLyrics) {
      let lyricsHtml = `<div class="lyrics-row" style="grid-template-columns:repeat(${cpr},1fr)">`
      rowCells.forEach((cell, colIdx) => {
        const idx = ri*cpr+colIdx
        const lpad = colIdx===0 ? 14 : (cell.barlineLeft ? 10 : 4)
        if (cell.lyrics || idx === editingLyricsIdx) {
          lyricsHtml += `<div class="cell-lyrics" contenteditable="true" data-idx="${idx}" style="padding-left:${lpad}px">${escHtml(cell.lyrics||'').replace(/\n/g,'<br>')}</div>`
        } else {
          lyricsHtml += `<div></div>`
        }
      })
      lyricsHtml += '</div>'
      html += lyricsHtml
    }

    rows.push(html)
  }

  const subLeft  = song.style    ? `<span>${escHtml(song.style)}</span>`    : ''
  const subRight = song.composer ? `<span>${escHtml(song.composer)}</span>` : ''
  const sub = (subLeft||subRight) ? `<div class="chart-header-sub">${subLeft}${subRight}</div>` : ''
  const header = `<div class="chart-header">` +
    `<div class="chart-header-title">${escHtml(song.title||'Untitled')}</div>` +
    sub +
    `</div>`
  area.innerHTML = header + rows.join('')

  area.querySelectorAll('.cell-lyrics').forEach(el => {
    const idx = +el.dataset.idx
    el.addEventListener('input', () => {
      song.cells[idx].lyrics = el.innerText.replace(/\n$/, '') || null
    })
    el.addEventListener('blur', () => {
      if (editingLyricsIdx === idx) {
        editingLyricsIdx = -1
        render()
      }
    })
    el.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); el.blur() }
      if (e.key === 'Tab')    { e.stopPropagation() }
    })
  })

  area.querySelectorAll('.cell').forEach(el => {
    el.addEventListener('mousedown', e=>{
      e.preventDefault()
      const idx = +el.dataset.idx
      const rect = el.getBoundingClientRect()
      const relY = e.clientY - rect.top

      // Save and exit lyrics editing if active
      if (editingLyricsIdx >= 0) {
        const lEl = area.querySelector(`.cell-lyrics[data-idx="${editingLyricsIdx}"]`)
        if (lEl) song.cells[editingLyricsIdx].lyrics = lEl.innerText.replace(/\n$/, '') || null
        editingLyricsIdx = -1
      }

      // Bottom 10px → start lyrics editing for this cell
      if (relY >= rect.height - 10) {
        commitEdit()
        editingLyricsIdx = idx
        render()
        return
      }

      if (editingIdx===idx) return
      commitEdit()
      if (e.detail >= 2) { startEdit(idx); return }
      if (e.shiftKey && anchorIdx<0) anchorIdx=focusIdx
      else if (!e.shiftKey) anchorIdx=-1
      focusIdx=idx; render()
    })
  })

  if (editingIdx>=0) {
    const input = document.getElementById('cellInput')
    if (input) {
      const cell = song.cells[editingIdx]
      if (cell.type==='chord') {
        const {root,quality,bass}=cell.chord
        input.value = root+(quality||'')+(bass?'/'+bass:'')
      } else {
        input.value = cell.type==='repeat'?'%':cell.type==='nc'?'N.C.':cell.type==='pause'?'p':''
      }
      input.focus(); input.select()
      updateAutocomplete(input.value)
      input.addEventListener('input',()=>updateAutocomplete(input.value))
      input.addEventListener('keydown',handleEditKeydown)
    }
  }

  if (editingLyricsIdx >= 0) {
    const lyricsEl = area.querySelector(`.cell-lyrics[data-idx="${editingLyricsIdx}"]`)
    if (lyricsEl) {
      lyricsEl.focus()
      const range = document.createRange()
      range.selectNodeContents(lyricsEl)
      range.collapse(false)
      window.getSelection().removeAllRanges()
      window.getSelection().addRange(range)
    }
  }

  try { localStorage.setItem('chord_chart_autosave', songToJSON()) } catch {}
}

// ─────────────────────────────────────────────
//  Cell rendering
// ─────────────────────────────────────────────
function renderTimeSig(ts) {
  if (!ts) return ''
  const [top,bot]=ts.split('/')
  return `<span class="time-sig"><span>${top}</span><span>${bot}</span></span>`
}

function renderCell(cell, ts) {
  const tsPart = renderTimeSig(ts)
  if (!cell||cell.type==='space') return tsPart
  if (cell.type==='nc')     return tsPart+`<span class="cell-nc">N.C.</span>`
  if (cell.type==='pause')  return tsPart+`<span class="cell-pause">·</span>`
  if (cell.type==='repeat') return tsPart+`<span class="cell-repeat">${cell.bars===2?'𝄎':'%'}</span>`
  if (cell.type==='chord') {
    const {root,quality,bass}=cell.chord
    const dispRoot = viewMode==='chord' ? root : degName(root, song.key, viewMode)
    const dispBass = bass ? (viewMode==='chord' ? bass : degName(bass, song.key, viewMode)) : null
    let inner=`<span class="chord-root">${dispRoot}</span>`
    if (quality) inner+=`<span class="chord-quality">${displayQuality(quality)}</span>`
    let html=`<span class="chord-wrapper">${inner}</span>`
    if (dispBass) html+=`<span class="chord-bass">/${dispBass}</span>`
    return tsPart+html
  }
  return tsPart
}

// ─────────────────────────────────────────────
//  Barline SVG
// ─────────────────────────────────────────────
function barlineSVG(type, side='left') {
  // SVG axis (main line) is always at x = width/2, centered on cell edge via CSS translateX.
  // Dots are always on the INSIDE: right-of-axis for left barlines, left-of-axis for right barlines.
  const h=40, d1=Math.round(h*.35), d2=Math.round(h*.65), r=2
  const ins = side==='left' ? 1 : -1   // +1 = rightward (inside for left), -1 = leftward (inside for right)

  switch(type) {
    case 'single': {
      // axis at x=2, width=4
      return `<svg overflow="visible" width="4" height="${h}"><line x1="2" y1="0" x2="2" y2="${h}" stroke="#333" stroke-width="2"/></svg>`
    }
    case 'double': {
      // two lines, ±3 from axis; axis at x=5, width=10
      return `<svg overflow="visible" width="10" height="${h}"><line x1="2" y1="0" x2="2" y2="${h}" stroke="#333" stroke-width="2"/><line x1="8" y1="0" x2="8" y2="${h}" stroke="#333" stroke-width="2"/></svg>`
    }
    case 'repeat-open':
    case 'repeat-close': {
      // single polyline: top-arm → vertical → bottom-arm, so joints are seamless
      const ax=8, dotX=ax+ins*5, off=4
      const pts=`${ax+ins*off},${-off} ${ax},0 ${ax},${h} ${ax+ins*off},${h+off}`
      return `<svg overflow="visible" width="16" height="${h}"><polyline points="${pts}" stroke="#333" stroke-width="2.5" fill="none" stroke-linejoin="miter" stroke-linecap="round"/><circle cx="${dotX}" cy="${d1}" r="${r}" fill="#333"/><circle cx="${dotX}" cy="${d2}" r="${r}" fill="#333"/></svg>`
    }
    case 'final': {
      // width=16, axis at x=8; thick at axis, thin 6px inside
      const ax=8, thin=ax+ins*6
      return `<svg overflow="visible" width="16" height="${h}"><line x1="${ax}"   y1="0" x2="${ax}"   y2="${h}" stroke="#333" stroke-width="5"/><line x1="${thin}" y1="0" x2="${thin}" y2="${h}" stroke="#333" stroke-width="2"/></svg>`
    }
    default: return ''
  }
}

// ─────────────────────────────────────────────
//  Editing
// ─────────────────────────────────────────────
let acSelectedIdx=-1, acItems=[]

function startEdit(idx) { editingIdx=idx; focusIdx=idx; anchorIdx=-1; render() }

function commitEdit() {
  if (editingIdx<0) return
  const input=document.getElementById('cellInput')
  if (!input) { editingIdx=-1; return }
  const text=input.value.trim()
  const cell=song.cells[editingIdx]
  saveHistory()
  const meta={id:cell.id, barlineLeft:cell.barlineLeft, barlineRight:cell.barlineRight,
    timeSignature:cell.timeSignature, rehearsalMark:cell.rehearsalMark}
  if (text==='') {
    song.cells[editingIdx]={...meta, type:'space', chord:null}
  } else {
    const parsed = acItems[acSelectedIdx]
      ? {type:'chord', chord:{root:acItems[acSelectedIdx].root, quality:acItems[acSelectedIdx].quality}}
      : parseChordInput(text)
    if (parsed) song.cells[editingIdx]={...meta, ...parsed}
  }
  editingIdx=-1; acSelectedIdx=-1; acItems=[]
}

function cancelEdit() { editingIdx=-1; acSelectedIdx=-1; acItems=[] }

function updateAutocomplete(text) {
  acItems=getSuggestions(text); acSelectedIdx=acItems.length>0?0:-1
  const ac=document.getElementById('autocomplete')
  if (!ac) return
  if (!acItems.length||!text.trim()) { ac.innerHTML=''; return }
  ac.innerHTML=acItems.map((item,i)=>
    `<div class="autocomplete-item${i===acSelectedIdx?' selected':''}" data-idx="${i}">${item.label}</div>`
  ).join('')
  ac.querySelectorAll('.autocomplete-item').forEach(el=>{
    el.addEventListener('mousedown',e=>{ e.preventDefault(); acSelectedIdx=+el.dataset.idx; commitEditAndMove(1) })
  })
}

function handleEditKeydown(e) {
  if (e.key==='ArrowDown'){e.preventDefault();if(acItems.length){acSelectedIdx=Math.min(acSelectedIdx+1,acItems.length-1);refreshAcSel()}return}
  if (e.key==='ArrowUp')  {e.preventDefault();if(acItems.length){acSelectedIdx=Math.max(acSelectedIdx-1,0);refreshAcSel()}return}
  if (e.key==='Enter'||e.key==='Tab'){e.preventDefault();commitEditAndMove(e.shiftKey?-1:1);return}
  if (e.key==='Escape'){cancelEdit();render();return}
}
function refreshAcSel() {
  document.querySelectorAll('.autocomplete-item').forEach((el,i)=>el.classList.toggle('selected',i===acSelectedIdx))
}
function commitEditAndMove(delta) {
  const cur=editingIdx; commitEdit()
  focusIdx=Math.max(0,Math.min(cur+delta,song.cells.length-1)); render()
}

// ─────────────────────────────────────────────
//  Navigation
// ─────────────────────────────────────────────
function moveFocus(delta, extendSel) {
  if (extendSel && anchorIdx<0) anchorIdx=focusIdx
  else if (!extendSel) anchorIdx=-1
  focusIdx=Math.max(0,Math.min(focusIdx+delta,song.cells.length-1))
}

document.addEventListener('keydown', e=>{
  if (editingIdx>=0) return
  if (e.target.tagName==='INPUT'||e.target.tagName==='SELECT'||e.target.isContentEditable) return
  const cpr=song.cellsPerRow||16

  if (e.key==='ArrowRight'||(e.key==='Tab'&&!e.shiftKey)){e.preventDefault();moveFocus(1,e.shiftKey&&e.key!=='Tab');render();return}
  if (e.key==='ArrowLeft' ||(e.key==='Tab'&& e.shiftKey)){e.preventDefault();moveFocus(-1,e.shiftKey&&e.key!=='Tab');render();return}
  if (e.key==='ArrowDown') {e.preventDefault();moveFocus(cpr,e.shiftKey);render();return}
  if (e.key==='ArrowUp')   {e.preventDefault();moveFocus(-cpr,e.shiftKey);render();return}
  if (e.key==='Escape'){anchorIdx=-1;render();return}
  if (e.key==='Enter'){startEdit(focusIdx);return}
  if (e.key==='Delete'||e.key==='Backspace'){
    saveHistory()
    for (let i=selMin();i<=selMax();i++){
      const c=song.cells[i]
      song.cells[i]={id:c.id,type:'space',chord:null,barlineLeft:c.barlineLeft,barlineRight:c.barlineRight,timeSignature:c.timeSignature,rehearsalMark:c.rehearsalMark}
    }
    anchorIdx=-1;render();return
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='c'){
    const ae=document.activeElement
    if (ae&&(ae.isContentEditable||ae.tagName==='INPUT')) return
    clipboard=song.cells.slice(selMin(),selMax()+1).map(c=>JSON.parse(JSON.stringify(c)))
    clipFromThisApp=true
    return
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='v'){
    const ae=document.activeElement
    if (ae&&(ae.isContentEditable||ae.tagName==='INPUT')) return
    if (!clipFromThisApp||!clipboard.length) return
    saveHistory()
    const insertAt=focusIdx+1
    const fresh=clipboard.map(c=>({...JSON.parse(JSON.stringify(c)),id:newId()}))
    song.cells.splice(insertAt,0,...fresh)
    focusIdx=insertAt+fresh.length-1; anchorIdx=-1
    render();return
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='z'){
    e.preventDefault()
    if (e.shiftKey) redo(); else undo()
    return
  }
  if ((e.ctrlKey||e.metaKey)&&e.key==='y'){
    e.preventDefault(); redo(); return
  }
  if (e.key.length===1&&!e.ctrlKey&&!e.metaKey){startEdit(focusIdx);return}
})

// ─────────────────────────────────────────────
//  Toolbar actions
// ─────────────────────────────────────────────
function addCells(n=4) {
  saveHistory()
  const fresh=Array.from({length:n},()=>makeCell())
  song.cells.splice(focusIdx,0,...fresh)
  anchorIdx=-1; render()
}

function deleteCells() {
  saveHistory()
  const a=selMin(),b=selMax()
  song.cells.splice(a,b-a+1)
  if (song.cells.length===0) song.cells.push(makeCell())
  focusIdx=Math.min(a,song.cells.length-1); anchorIdx=-1; render()
}

function setBarlineLeft(type) {
  saveHistory()
  song.cells[focusIdx].barlineLeft = type==='none'?null:type; render()
}
function setBarlineRight(type) {
  saveHistory()
  song.cells[focusIdx].barlineRight = type==='none'?null:type; render()
}
function setMark(mark) { saveHistory(); song.cells[focusIdx].rehearsalMark=mark; render() }
function setTimeSig() {
  saveHistory()
  song.cells[focusIdx].timeSignature=document.getElementById('timeSigSelect').value; render()
}
function clearTimeSig() { saveHistory(); delete song.cells[focusIdx].timeSignature; render() }

// ─────────────────────────────────────────────
//  Save / Load
// ─────────────────────────────────────────────
function songToJSON() {
  return JSON.stringify({...song,
    title:    document.getElementById('songTitle').value,
    composer: document.getElementById('songComposer').value,
    style:    document.getElementById('songStyle').value,
    key:      document.getElementById('songKey').value,
    timeSignature: document.getElementById('songTime').value,
  },null,2)
}

function loadSongData(data) {
  if (!Array.isArray(data.cells)) return false  // old format, ignore
  if (!data.cellsPerRow) data.cellsPerRow=16
  song=data
  document.getElementById('songTitle').value    = data.title    ||''
  document.getElementById('songComposer').value = data.composer ||''
  document.getElementById('songStyle').value    = data.style    ||''
  syncKeySelect(data.key)
  const timeEl=document.getElementById('songTime')
  for (const opt of timeEl.options) { if (opt.value===data.timeSignature){opt.selected=true;break} }
  focusIdx=0; editingIdx=-1; anchorIdx=-1; render()
}


function saveToFile() {
  const json=songToJSON()
  localStorage.setItem('chord_chart_autosave',json)
  const blob=new Blob([json],{type:'application/json'})
  const a=document.createElement('a')
  a.href=URL.createObjectURL(blob)
  const title=(document.getElementById('songTitle').value||'chart').replace(/[^a-zA-Z0-9一-龥 _-]/g,'_')
  a.download=title+'.json'; a.click()
}

function loadFromFile(e) {
  const file=e.target.files[0]; if (!file) return
  const reader=new FileReader()
  reader.onload=ev=>{
    try { const data=JSON.parse(ev.target.result); loadSongData(data); localStorage.setItem('chord_chart_autosave',ev.target.result) }
    catch { alert('Invalid JSON file') }
  }
  reader.readAsText(file); e.target.value=''
}

// ─────────────────────────────────────────────
//  Init
// ─────────────────────────────────────────────
const saved=localStorage.getItem('chord_chart_autosave')
if (saved) {
  try {
    const ok = loadSongData(JSON.parse(saved))
    if (ok === false) { localStorage.removeItem('chord_chart_autosave'); render() }
  } catch { render() }
} else {
  render()
}

function applyScale() {
  const sx = document.getElementById('scaleX').value / 100
  const sy = document.getElementById('scaleY').value / 100
  document.getElementById('scaleXLabel').textContent = Math.round(sx*100) + '%'
  document.getElementById('scaleYLabel').textContent = Math.round(sy*100) + '%'
  const area = document.getElementById('chartArea')
  const wrapper = document.getElementById('chartWrapper')
  area.style.transform = `scaleX(${sx}) scaleY(${sy})`
  area.style.transformOrigin = 'top left'
  wrapper.style.height = (area.scrollHeight * sy) + 'px'
}
document.getElementById('scaleX').addEventListener('input', applyScale)
document.getElementById('scaleY').addEventListener('input', applyScale)

</script>
